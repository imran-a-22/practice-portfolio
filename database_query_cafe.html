<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Database Query Cafe</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#ffecd2,#fcb69f);font-family:Arial,sans-serif;color:#331b15;padding:18px}.cafe{max-width:1180px;margin:auto;background:#fffaf2;border:7px solid #331b15;border-radius:28px;overflow:hidden;box-shadow:16px 18px 0 #d94f30}header{background:#ffcf5a;padding:22px;border-bottom:7px solid #331b15;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:clamp(30px,5vw,58px)}.stats{display:flex;gap:10px}.stat{background:#331b15;color:#fffaf2;border-radius:12px;padding:10px 14px;text-align:center;min-width:90px}.stat b{display:block;font-size:28px;color:#ffcf5a}main{display:grid;grid-template-columns:1fr 370px;min-height:650px}.tables{padding:24px;background:repeating-linear-gradient(90deg,#fffaf2 0 30px,#ffe8c7 30px 60px)}table{width:100%;border-collapse:collapse;background:white;box-shadow:8px 8px 0 #0002}th,td{border:3px solid #331b15;padding:10px;text-align:left}th{background:#331b15;color:white}.order{margin-top:20px;background:#d94f30;color:white;border:4px solid #331b15;border-radius:18px;padding:16px;font-size:20px;line-height:1.4}.panel{border-left:7px solid #331b15;background:#fff2d5;padding:22px}.builder{background:white;border:4px solid #331b15;border-radius:18px;padding:14px;margin-bottom:14px}.clause{margin:10px 0}.clause h3{margin:0 0 8px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:3px solid #331b15;background:#fffaf2;padding:8px 10px;border-radius:999px;cursor:pointer;font-weight:bold}.chip:hover,.chip.pick{background:#6ed1ff}.query{background:#331b15;color:#6ed1ff;border-radius:14px;padding:14px;min-height:90px;font-family:"Courier New",monospace}.feedback{min-height:120px;background:white;border-left:8px solid #d94f30;padding:14px;line-height:1.45;margin-top:14px}button{width:100%;border:0;background:#331b15;color:white;border-radius:12px;padding:14px;margin-top:10px;font-weight:bold;cursor:pointer}@media(max-width:900px){main{grid-template-columns:1fr}.panel{border-left:0;border-top:7px solid #331b15}}</style></head><body><div class="cafe"><header><div><h1>Database Query Cafe</h1><p>Build beginner SQL-style queries by choosing SELECT, WHERE, and ORDER BY clauses for cafe data.</p></div><div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">Order<b id="level">1</b></div></div></header><main><section class="tables"><table id="menu"></table><div class="order"><b>Customer request:</b><br><span id="request"></span></div></section><aside class="panel"><div class="builder"><div class="clause"><h3>SELECT</h3><div class="chips" id="selects"></div></div><div class="clause"><h3>WHERE</h3><div class="chips" id="wheres"></div></div><div class="clause"><h3>ORDER BY</h3><div class="chips" id="orders"></div></div></div><div class="query" id="query">SELECT ...</div><button id="run">Run Query</button><button id="next">Next Customer</button><div class="feedback" id="feedback">Choose query clauses.</div></aside></main></div><script>const rows=[["Latte","drink",3.20,4.7],["Tea","drink",2.10,4.2],["Brownie","food",2.80,4.8],["Sandwich","food",5.50,4.4],["Juice","drink",3.00,4.1],["Cookie","food",1.60,4.0]];const orders=[{r:"Show only drinks cheaper than £3.10.",s:"name, price",w:"category = drink AND price < 3.10",o:"none",why:"The WHERE clause filters rows by category and price."},{r:"Show food items ordered by rating.",s:"name, rating",w:"category = food",o:"rating DESC",why:"ORDER BY sorts the filtered food rows from highest rating down."},{r:"Show every item with price, cheapest first.",s:"name, price",w:"none",o:"price ASC",why:"No WHERE filter is needed when every row should appear."},{r:"Show popular items rated at least 4.5.",s:"name, rating",w:"rating >= 4.5",o:"rating DESC",why:"The filter keeps high-rated items and sorting ranks them."}];let i=0,score=0,pick={s:"",w:"",o:""};function renderTable(){menu.innerHTML="<tr><th>name</th><th>category</th><th>price</th><th>rating</th></tr>"+rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>£${r[2].toFixed(2)}</td><td>${r[3]}</td></tr>`).join("")}function chips(id,arr,key){document.getElementById(id).innerHTML=arr.map(x=>`<span class="chip">${x}</span>`).join("");document.querySelectorAll("#"+id+" .chip").forEach(c=>c.onclick=()=>{pick[key]=c.textContent;document.querySelectorAll("#"+id+" .chip").forEach(x=>x.classList.remove("pick"));c.classList.add("pick");updateQ()})}function load(){pick={s:"",w:"",o:""};request.textContent=orders[i].r;level.textContent=i+1;chips("selects",["name, price","name, rating","*"],"s");chips("wheres",["none","category = drink AND price < 3.10","category = food","rating >= 4.5"],"w");chips("orders",["none","rating DESC","price ASC","name ASC"],"o");feedback.textContent="Build the query requested by the customer.";updateQ()}function updateQ(){query.textContent="SELECT "+(pick.s||"...")+" FROM menu
WHERE "+(pick.w||"...")+"
ORDER BY "+(pick.o||"...")}run.onclick=()=>{let a=orders[i];if(pick.s===a.s&&pick.w===a.w&&pick.o===a.o){score+=120;feedback.textContent="Correct. "+a.why}else{score=Math.max(0,score-20);feedback.textContent=`Not quite. Correct: SELECT ${a.s}, WHERE ${a.w}, ORDER BY ${a.o}. ${a.why}`}document.getElementById("score").textContent=score};next.onclick=()=>{i=(i+1)%orders.length;load()};renderTable();load();</script></body></html>
