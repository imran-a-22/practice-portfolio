<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Prefix Suffix Spellforge</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle,#4b1d0b,#120703);color:#ffe6b0;font-family:Georgia,serif;padding:18px}.forge{max-width:1120px;margin:auto;border:8px ridge #b56b2a;border-radius:24px;background:#21100a;box-shadow:0 0 80px rgba(255,110,20,.3);overflow:hidden}header{padding:22px;background:linear-gradient(#6d260d,#271008);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:clamp(30px,5vw,58px);color:#ffd66b}.stats{display:flex;gap:8px}.stat{background:#100703;border:3px solid #b56b2a;padding:9px 13px;border-radius:12px;text-align:center}.stat b{display:block;font-size:26px;color:#ff9a37}main{display:grid;grid-template-columns:1fr 330px;min-height:620px}.anvil{padding:28px;background:radial-gradient(circle at center,#a74114,#21100a 65%);position:relative}.fire{height:210px;border-radius:50%;background:radial-gradient(circle,#fff0a6 0 10%,#ff9a37 20%,#d13613 45%,transparent 65%);animation:flicker 1s infinite alternate}.hammer{font-size:90px;text-align:center;animation:hit 1.6s infinite;transform-origin:bottom}@keyframes hit{50%{transform:rotate(-20deg) translateY(-20px)}}@keyframes flicker{to{transform:scale(1.04)}}.wordbench{background:rgba(0,0,0,.45);border:4px solid #ffd66b;border-radius:18px;margin-top:22px;padding:18px;text-align:center}.word{font-size:46px;color:#fff}.tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}.tile{border:3px solid #ffd66b;background:#32150b;color:#ffe6b0;padding:14px 18px;border-radius:14px;cursor:pointer;font-size:20px}.tile:hover,.tile.pick{background:#ff9a37;color:#120703}.panel{border-left:8px ridge #b56b2a;background:#160905;padding:22px}.quest{background:#2b1208;border:3px solid #b56b2a;border-radius:16px;padding:16px;line-height:1.45}.slots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:15px 0}.slot{min-height:60px;border:3px dashed #ffd66b;border-radius:12px;display:grid;place-items:center;font-size:18px;background:#100703}button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:10px;background:#ffd66b;color:#120703;font-weight:bold;cursor:pointer}.feedback{min-height:120px;background:#2b1208;border-left:7px solid #ff9a37;margin-top:15px;padding:14px;line-height:1.45}@media(max-width:850px){main{grid-template-columns:1fr}.panel{border-left:0;border-top:8px ridge #b56b2a}}</style></head><body><div class="forge"><header><div><h1>Prefix Suffix Spellforge</h1><p>Forge words by combining prefix, root, and suffix. Learn how parts of words change meaning.</p></div><div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">Forge<b id="level">1</b></div></div></header><main><section class="anvil"><div class="fire"></div><div class="hammer">🔨</div><div class="wordbench"><div>Forged Word</div><div class="word" id="word">---</div><div class="tiles" id="tiles"></div></div></section><aside class="panel"><div class="quest"><h2 id="prompt">Quest</h2><p id="meaning"></p></div><div class="slots"><div class="slot" id="prefix">Prefix</div><div class="slot" id="root">Root</div><div class="slot" id="suffix">Suffix</div></div><button id="check">Check Forge</button><button id="clear">Clear</button><button id="next">Next Quest</button><div class="feedback" id="feedback">Select three parts: prefix + root + suffix.</div></aside></main></div><script>const quests=[{meaning:'not able to be believed',parts:['un','believe','able'],word:'unbelievable',explain:'un = not, believe = accept as true, able = capable of.'},{meaning:'the act of improving again',parts:['re','improve','ment'],word:'reimprovement',explain:'re = again, improve = make better, ment = act/result.'},{meaning:'wrongly understand',parts:['mis','understand',''],word:'misunderstand',explain:'mis = wrongly or badly.'},{meaning:'full of care',parts:['','care','ful'],word:'careful',explain:'ful = full of.'},{meaning:'before viewing something',parts:['pre','view',''],word:'preview',explain:'pre = before.'}];let i=0,score=0,chosen={prefix:'',root:'',suffix:''};const pool=['un','re','mis','pre','believe','improve','understand','care','view','able','ment','ful','less','er'];function load(){chosen={prefix:'',root:'',suffix:''};document.getElementById('level').textContent=i+1;document.getElementById('meaning').textContent='Forge a word meaning: '+quests[i].meaning;document.getElementById('tiles').innerHTML=pool.map(x=>'<div class="tile">'+x+'</div>').join('');document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>pick(t));sync();feedback.textContent='Select the best prefix/root/suffix.'}function pick(t){let text=t.textContent;if(['un','re','mis','pre'].includes(text))chosen.prefix=text;else if(['able','ment','ful','less','er'].includes(text))chosen.suffix=text;else chosen.root=text;t.classList.add('pick');sync()}function sync(){prefix.textContent=chosen.prefix||'Prefix';root.textContent=chosen.root||'Root';suffix.textContent=chosen.suffix||'Suffix';word.textContent=(chosen.prefix+chosen.root+chosen.suffix)||'---'}check.onclick=()=>{let q=quests[i];if(chosen.prefix===q.parts[0]&&chosen.root===q.parts[1]&&chosen.suffix===q.parts[2]){score+=120;feedback.textContent='Correct: '+q.word+'. '+q.explain}else{score=Math.max(0,score-15);feedback.textContent='Not quite. Correct forge: '+q.parts.join(' + ')+' = '+q.word+'. '+q.explain}document.getElementById('score').textContent=score};clear.onclick=()=>load();next.onclick=()=>{i=(i+1)%quests.length;load()};load();</script></body></html>
