<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Exoplanet Transit Telescope</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#030712;color:#dbeafe;font-family:Trebuchet MS,sans-serif;padding:18px}.obs{max-width:1180px;margin:auto;border:4px solid #7dd3fc;border-radius:28px;overflow:hidden;background:#07111f;box-shadow:0 0 70px rgba(125,211,252,.25)}
header{padding:22px;background:radial-gradient(circle at 20% 0,#1d4ed8,#020617);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:clamp(30px,5vw,58px)}.stats{display:flex;gap:10px}.stat{border:2px solid #7dd3fc;border-radius:16px;padding:10px 14px;background:#020617;text-align:center}.stat b{display:block;font-size:28px;color:#fde68a}
main{display:grid;grid-template-columns:1fr 350px;min-height:640px}.sky{padding:24px;background:radial-gradient(circle at center,#111827,#030712 70%);position:relative;overflow:hidden}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:37px 37px;opacity:.4}.star{position:relative;margin:30px auto;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,#fff7ad 0 25%,#f59e0b 55%,#7c2d12 80%);box-shadow:0 0 80px #fbbf24}.planet{position:absolute;width:44px;height:44px;background:#0f172a;border:2px solid #7dd3fc;border-radius:50%;top:92px;left:-70px;animation:orbit 6s linear infinite}@keyframes orbit{to{left:255px}}
canvas{position:relative;width:100%;height:260px;background:#020617;border:3px solid #7dd3fc;border-radius:16px;margin-top:35px}.panel{border-left:4px solid #7dd3fc;background:#07111f;padding:22px}.card{background:#020617;border:2px solid #7dd3fc;border-radius:18px;padding:16px;margin-bottom:14px;line-height:1.45}.options{display:grid;gap:10px}.options button{border:2px solid #7dd3fc;background:#0f172a;color:#dbeafe;border-radius:12px;padding:13px;text-align:left;cursor:pointer}.options button:hover{background:#1d4ed8}.feedback{min-height:130px;background:#0f172a;border-left:8px solid #fde68a;padding:14px;border-radius:12px;line-height:1.45}button#next{width:100%;margin-top:12px;border:0;border-radius:12px;padding:14px;background:#fde68a;color:#020617;font-weight:bold;cursor:pointer}@media(max-width:850px){main{grid-template-columns:1fr}.panel{border-left:0;border-top:4px solid #7dd3fc}}
</style></head><body><div class="obs"><header><div><h1>Exoplanet Transit Telescope</h1><p>Spot planets by reading brightness dips in a star’s light curve.</p></div><div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">Star<b id="level">1</b></div></div></header><main><section class="sky"><div class="stars"></div><div class="star"><div class="planet"></div></div><canvas id="chart" width="760" height="260"></canvas></section><aside class="panel"><div class="card"><h2 id="target">Target Star</h2><p id="brief"></p></div><div class="options" id="options"></div><button id="next">Next Star</button><div class="feedback" id="feedback">A transit is a repeated dip in brightness when a planet crosses in front of its star.</div></aside></main></div><script>
const cases=[{name:'Kepler-Red',dip:12,ans:'Large close planet',why:'Deep, regular dips suggest a larger planet blocking more light.'},{name:'Mira-22',dip:3,ans:'Small planet',why:'Small dips suggest a smaller planet.'},{name:'Noise-9',dip:0,ans:'No clear planet',why:'Random noise without regular dips is not strong transit evidence.'},{name:'Twin-Blue',dip:8,ans:'Possible planet',why:'Repeating dips at steady intervals suggest a candidate exoplanet.'}];let i=0,score=0;const ctx=chart.getContext('2d');
function draw(){let c=cases[i];ctx.clearRect(0,0,760,260);ctx.strokeStyle='#1f3b5f';for(let x=0;x<760;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,260);ctx.stroke()}ctx.strokeStyle='#7dd3fc';ctx.lineWidth=3;ctx.beginPath();for(let x=0;x<760;x++){let y=90+Math.sin(x/23)*4;if(c.dip){for(let center of [160,360,560]){let d=Math.abs(x-center);if(d<28)y+=c.dip*(1+Math.cos(d/28*Math.PI));}}else y+=Math.sin(x/7)*10*Math.random();if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();level.textContent=i+1;target.textContent=cases[i].name;brief.textContent='Classify the light curve signal.';options.innerHTML=['Large close planet','Small planet','Possible planet','No clear planet'].map(o=>`<button>${o}</button>`).join('');document.querySelectorAll('.options button').forEach(b=>b.onclick=()=>choose(b.textContent))}
function choose(o){let c=cases[i];if(o===c.ans){score+=120;feedback.textContent='Correct. '+c.why}else{score=Math.max(0,score-20);feedback.textContent='Not quite. Best answer: '+c.ans+'. '+c.why}document.getElementById('score').textContent=score}
next.onclick=()=>{i=(i+1)%cases.length;draw();feedback.textContent='New light curve loaded.'};draw();
</script></body></html>
