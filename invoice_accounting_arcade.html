<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Invoice Accounting Arcade</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eef1f5;color:#1d2733;font-family:Arial,sans-serif;padding:18px}.arcade{max-width:1160px;margin:auto;background:white;border:5px solid #1d2733;border-radius:18px;overflow:hidden;box-shadow:12px 12px 0 #2f80ed}header{padding:22px;background:#1d2733;color:white;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:clamp(30px,5vw,56px)}.stats{display:flex;gap:9px}.stat{background:#fff;color:#1d2733;border-radius:10px;padding:9px 13px;text-align:center;min-width:90px}.stat b{display:block;font-size:28px;color:#2f80ed}main{display:grid;grid-template-columns:1fr 360px;min-height:630px}.desk{background:linear-gradient(#f9fbff,#dfe8f5);padding:24px;position:relative}.invoice{background:#fff;border:3px solid #1d2733;max-width:560px;margin:auto;padding:22px;box-shadow:8px 8px 0 rgba(29,39,51,.18);transform:rotate(-1deg)}.invoice h2{margin:0;border-bottom:3px solid #1d2733;padding-bottom:8px}.row{display:flex;justify-content:space-between;border-bottom:1px dashed #9aa7b5;padding:10px 0}.stamp{display:inline-block;border:4px solid #e84a5f;color:#e84a5f;padding:8px 16px;transform:rotate(-8deg);font-weight:bold;font-size:26px;margin-top:18px}.accounts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}.account{border:3px solid #1d2733;border-radius:14px;background:white;padding:15px;text-align:center;font-weight:bold;cursor:pointer}.account:hover,.account.pick{background:#2f80ed;color:white}.panel{border-left:5px solid #1d2733;background:#fff9e8;padding:22px}.card{border:3px solid #1d2733;background:white;border-radius:14px;padding:15px;margin-bottom:14px;line-height:1.45}.entry{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:3px dashed #1d2733;min-height:70px;border-radius:12px;display:grid;place-items:center;background:#f8fbff;text-align:center;font-weight:bold}button{width:100%;border:0;background:#2f80ed;color:white;font-weight:bold;padding:14px;border-radius:10px;margin-top:10px;cursor:pointer}.feedback{min-height:125px;background:#eef1f5;border-left:8px solid #2f80ed;padding:14px;line-height:1.45}@media(max-width:850px){main{grid-template-columns:1fr}.panel{border-left:0;border-top:5px solid #1d2733}}</style></head><body><div class="arcade"><header><div><h1>Invoice Accounting Arcade</h1><p>Choose the debit and credit for common invoice transactions. Keep the accounting equation balanced.</p></div><div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">Txn<b id="level">1</b></div><div class="stat">Accuracy<b id="acc">100%</b></div></div></header><main><section class="desk"><div class="invoice"><h2 id="docTitle">Invoice</h2><div class="row"><span>Customer/Supplier</span><b id="party"></b></div><div class="row"><span>Description</span><b id="desc"></b></div><div class="row"><span>Amount</span><b id="amount"></b></div><div class="stamp" id="stamp">POST IT</div></div><div class="accounts" id="accounts"></div></section><aside class="panel"><div class="card"><h2>Journal Entry</h2><p id="task"></p><div class="entry"><div class="box" id="debit">Debit</div><div class="box" id="credit">Credit</div></div></div><button id="check">Post Entry</button><button id="clear">Clear</button><button id="next">Next Transaction</button><div class="feedback" id="feedback">Select one account for Debit and one for Credit.</div></aside></main></div><script>const txns=[{title:'Sales Invoice',party:'Blue Ltd',desc:'Sold design service on credit',amount:'£900',debit:'Trade Receivables',credit:'Sales Revenue',why:'A credit sale increases receivables with a debit and increases income with a credit.'},{title:'Supplier Bill',party:'WebHost Co',desc:'Received hosting bill on credit',amount:'£120',debit:'Computer Expense',credit:'Trade Payables',why:'An unpaid bill records the expense now and creates a payable.'},{title:'Customer Receipt',party:'Blue Ltd',desc:'Customer paid old invoice',amount:'£900',debit:'Bank',credit:'Trade Receivables',why:'Cash increases, while the customer receivable is cleared.'},{title:'Rent Payment',party:'City Offices',desc:'Paid monthly rent by bank',amount:'£700',debit:'Rent Expense',credit:'Bank',why:'Expense increases with a debit and bank decreases with a credit.'},{title:'Owner Investment',party:'Owner',desc:'Owner paid money into business bank',amount:'£1,000',debit:'Bank',credit:'Capital',why:'Bank asset increases and owner equity increases.'}];const acctList=['Bank','Trade Receivables','Sales Revenue','Computer Expense','Trade Payables','Rent Expense','Capital','Drawings'];let i=0,score=0,attempts=0,correct=0,side='debit',entry={debit:'',credit:''};function load(){let t=txns[i];entry={debit:'',credit:''};side='debit';level.textContent=i+1;docTitle.textContent=t.title;party.textContent=t.party;desc.textContent=t.desc;amount.textContent=t.amount;task.textContent='Post the correct debit and credit.';accountsEl();syncBoxes();feedback.textContent='Choose the debit account first.'}function accountsEl(){accounts.innerHTML=acctList.map(a=>'<div class="account">'+a+'</div>').join('');document.querySelectorAll('.account').forEach(a=>a.onclick=()=>pick(a.textContent,a))}function pick(a,el){if(side==='debit'){entry.debit=a;side='credit';feedback.textContent='Debit selected. Now choose the credit account.'}else{entry.credit=a;side='debit';feedback.textContent='Credit selected. Ready to post.'}document.querySelectorAll('.account').forEach(x=>x.classList.remove('pick'));el.classList.add('pick');syncBoxes()}function syncBoxes(){debit.textContent=entry.debit||'Debit';credit.textContent=entry.credit||'Credit'}check.onclick=()=>{let t=txns[i];attempts++;if(entry.debit===t.debit&&entry.credit===t.credit){correct++;score+=130;feedback.textContent='Correct. '+t.why}else{score=Math.max(0,score-20);feedback.textContent='Not quite. Correct entry: Debit '+t.debit+', Credit '+t.credit+'. '+t.why}scoreEl()};function scoreEl(){document.getElementById('score').textContent=score;document.getElementById('acc').textContent=attempts?Math.round(correct/attempts*100)+'%':'100%'}clear.onclick=()=>{entry={debit:'',credit:''};side='debit';syncBoxes();feedback.textContent='Cleared. Choose the debit account.'};next.onclick=()=>{i=(i+1)%txns.length;load()};load();scoreEl();</script></body></html>
