<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Contract Clause Hunt</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#ede7d7;color:#20160f;font-family:Georgia,serif;padding:18px}.desk{max-width:1160px;margin:auto;background:#fffaf0;border:8px double #20160f;box-shadow:14px 14px 0 #6b4a2e;overflow:hidden}header{padding:22px;background:#d2b48c;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:clamp(30px,5vw,58px)}.stats{display:flex;gap:8px}.stat{background:#20160f;color:#fffaf0;padding:9px 13px;text-align:center}.stat b{display:block;color:#ffd27a;font-size:28px}
main{display:grid;grid-template-columns:1fr 350px;min-height:640px}.paper{padding:30px;background:repeating-linear-gradient(#fffaf0 0 34px,#f2e5c9 35px 36px)}.contract{max-width:620px;margin:auto;background:#fffdf7;border:3px solid #20160f;padding:28px;box-shadow:8px 8px 0 rgba(0,0,0,.18);line-height:1.7;font-size:20px}.clause{padding:2px 6px;border-radius:6px;cursor:pointer}.clause:hover,.clause.pick{background:#ffd27a}.seal{width:90px;height:90px;border-radius:50%;background:#a52a2a;color:white;display:grid;place-items:center;float:right;transform:rotate(12deg);font-weight:bold}.panel{border-left:8px double #20160f;background:#f2e5c9;padding:22px}.card{background:#fffdf7;border:3px solid #20160f;padding:15px;margin-bottom:14px;line-height:1.45}.options{display:grid;gap:10px}button{border:3px solid #20160f;background:#fffdf7;padding:13px;font-weight:bold;cursor:pointer;text-align:left}button:hover{background:#ffd27a}.feedback{min-height:135px;background:#fffdf7;border-left:8px solid #a52a2a;padding:14px;line-height:1.45}@media(max-width:850px){main{grid-template-columns:1fr}.panel{border-left:0;border-top:8px double #20160f}}
</style></head><body><div class="desk"><header><div><h1>Contract Clause Hunt</h1><p>Identify basic contract-law ideas inside short agreement extracts.</p></div><div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">File<b id="level">1</b></div></div></header><main><section class="paper"><div class="contract"><div class="seal">SIGNED</div><h2>Service Agreement Extract</h2><p id="text"></p></div></section><aside class="panel"><div class="card"><h2>Mission</h2><p id="prompt">Choose the legal concept shown by the highlighted clause.</p></div><div class="options" id="options"></div><button id="next" style="margin-top:10px;background:#20160f;color:white">Next File</button><div class="feedback" id="feedback">Read carefully. This is educational, not legal advice.</div></aside></main></div><script>
const qs=[{text:'The Designer agrees to build a landing page for £500, payable on delivery.',focus:'£500',ans:'Consideration',why:'Consideration is the value exchanged between parties.'},{text:'The Client writes: “I accept your proposal and agree to the price.”',focus:'I accept your proposal',ans:'Acceptance',why:'Acceptance shows agreement to the offer.'},{text:'The Developer offers to complete the work by 1 July for a fixed fee.',focus:'offers',ans:'Offer',why:'An offer proposes clear terms capable of acceptance.'},{text:'If the Supplier fails to deliver by the deadline, the Client may cancel the order.',focus:'fails to deliver',ans:'Breach',why:'Breach means failing to perform a contractual obligation.'}];let i=0,score=0;const opts=['Offer','Acceptance','Consideration','Breach'];function load(){let q=qs[i];level.textContent=i+1;text.innerHTML=q.text.replace(q.focus,`<span class="clause pick">${q.focus}</span>`);options.innerHTML=opts.map(o=>`<button>${o}</button>`).join('');document.querySelectorAll('#options button').forEach(b=>b.onclick=()=>choose(b.textContent));feedback.textContent='Identify the concept.'}
function choose(o){let q=qs[i];if(o===q.ans){score+=110;feedback.textContent='Correct. '+q.why}else{score=Math.max(0,score-15);feedback.textContent='Not quite. Best answer: '+q.ans+'. '+q.why}document.getElementById('score').textContent=score}next.onclick=()=>{i=(i+1)%qs.length;load()};load();
</script></body></html>
