<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Periodic Family Sorter</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07111f;color:#eaf6ff;font-family:Arial,sans-serif;padding:18px}.app{max-width:1160px;margin:auto;background:#0b1d33;border:5px solid #64ffda;border-radius:24px;overflow:hidden;box-shadow:0 0 60px rgba(100,255,218,.2)}header{padding:22px;background:linear-gradient(90deg,#102542,#006c67);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{margin:0;font-size:clamp(30px,5vw,58px)}.stats{display:flex;gap:8px}.stat{background:#eaf6ff;color:#07111f;border-radius:12px;padding:9px 13px;text-align:center;min-width:85px}.stat b{display:block;font-size:27px}main{display:grid;grid-template-columns:1fr 350px;min-height:650px}.table{padding:22px;border-right:5px solid #64ffda;background:radial-gradient(circle at center,#123a5a,#07111f)}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}.el{min-height:88px;border:3px solid #64ffda;border-radius:12px;background:#102542;display:grid;place-items:center;text-align:center;cursor:pointer;transition:.15s}.el:hover,.el.pick{transform:translateY(-4px);background:#1a4d73}.symbol{font-size:30px;font-weight:bold;color:#ffdc64}.families{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.bin{border:3px dashed #ffdc64;border-radius:14px;min-height:80px;padding:10px;text-align:center;background:#102542;cursor:pointer}.bin:hover,.bin.active{background:#006c67}.panel{background:#07111f;padding:22px}.card{background:#102542;border:3px solid #64ffda;border-radius:18px;padding:16px;margin-bottom:14px;line-height:1.45}.feedback{min-height:140px;border-left:7px solid #ffdc64;border-radius:12px;background:#0b1d33;padding:12px;line-height:1.45}button{width:100%;border:0;border-radius:13px;background:#64ffda;color:#07111f;padding:13px;font-weight:bold;cursor:pointer}@media(max-width:850px){main{grid-template-columns:1fr}.table{border-right:0;border-bottom:5px solid #64ffda}.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="app"><header><div><h1>Periodic Family Sorter</h1><p>Click an element, then click the correct chemical family.</p></div><div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">Sorted<b id="sorted">0</b></div></div></header><main><section class="table"><div class="grid" id="elements"></div><div class="families" id="families"></div></section><aside class="panel"><div class="card"><h2 id="selected">No element selected</h2><p>Use periodic-table patterns: Group 1 = alkali metals, Group 2 = alkaline earth, Group 17 = halogens, Group 18 = noble gases.</p></div><button id="reset">Reset Board</button><div class="feedback" id="feedback">Start by selecting an element tile.</div></aside></main></div><script>const data=[['Li','Lithium','Alkali metal'],['Na','Sodium','Alkali metal'],['Mg','Magnesium','Alkaline earth'],['Ca','Calcium','Alkaline earth'],['F','Fluorine','Halogen'],['Cl','Chlorine','Halogen'],['Ne','Neon','Noble gas'],['Ar','Argon','Noble gas'],['K','Potassium','Alkali metal'],['Br','Bromine','Halogen'],['He','Helium','Noble gas'],['Be','Beryllium','Alkaline earth']];const fams=['Alkali metal','Alkaline earth','Halogen','Noble gas'];let pick=null,score=0,done=0;function load(){elements.innerHTML=data.map((e,i)=>`<div class="el" data-i="${i}"><div><div class="symbol">${e[0]}</div><small>${e[1]}</small></div></div>`).join('');families.innerHTML=fams.map(f=>`<div class="bin" data-f="${f}">${f}</div>`).join('');document.querySelectorAll('.el').forEach(el=>el.onclick=()=>select(el));document.querySelectorAll('.bin').forEach(b=>b.onclick=()=>sort(b.dataset.f));feedback.textContent='Start by selecting an element tile.'}function select(el){document.querySelectorAll('.el').forEach(x=>x.classList.remove('pick'));el.classList.add('pick');pick=Number(el.dataset.i);selected.textContent=data[pick][0]+' — '+data[pick][1]}function sort(f){if(pick===null){feedback.textContent='Select an element first.';return}let e=data[pick];if(f===e[2]){score+=100;done++;feedback.textContent='Correct: '+e[1]+' belongs to '+e[2]+'.';document.querySelector(`[data-i="${pick}"]`).style.visibility='hidden';pick=null}else{score=Math.max(0,score-15);feedback.textContent='Not quite. '+e[1]+' is a '+e[2]+'.'}document.getElementById('score').textContent=score;sorted.textContent=done}reset.onclick=()=>{pick=null;score=0;done=0;document.getElementById('score').textContent=0;sorted.textContent=0;selected.textContent='No element selected';load()};load();</script></body></html>
