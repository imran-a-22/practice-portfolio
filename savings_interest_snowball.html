<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Savings Interest Snowball</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#dff7ff,#ffffff);font-family:Arial,sans-serif;color:#123;padding:18px}.bank{max-width:1160px;margin:auto;border:5px solid #123;border-radius:24px;overflow:hidden;background:white;box-shadow:12px 12px 0 #8dd7ff}header{padding:22px;background:#8dd7ff;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:clamp(30px,5vw,58px)}.stats{display:flex;gap:10px}.stat{background:white;border:3px solid #123;border-radius:14px;padding:9px 14px;text-align:center}.stat b{display:block;font-size:28px;color:#0a7a4b}
main{display:grid;grid-template-columns:1fr 350px;min-height:630px}.hill{padding:28px;background:linear-gradient(#eefaff,#c8ecff);position:relative}.snowball{width:120px;height:120px;border-radius:50%;background:white;border:5px solid #123;box-shadow:inset -20px -20px 0 #d9eef7,8px 8px 0 rgba(0,0,0,.15);display:grid;place-items:center;font-weight:bold;margin:30px auto;font-size:20px}.track{height:260px;border-bottom:10px solid #123;border-radius:0 0 50% 50%;position:relative}.coin{position:absolute;width:52px;height:52px;border-radius:50%;background:#ffd54a;border:4px solid #123;display:grid;place-items:center;font-weight:bold}.c1{left:15%;top:60px}.c2{left:43%;top:130px}.c3{right:15%;top:80px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{border:3px solid #123;background:#fff;border-radius:14px;padding:14px;cursor:pointer;text-align:center}.choice:hover,.choice.pick{background:#ffd54a}.panel{border-left:5px solid #123;background:#fff8dc;padding:22px}.card{background:white;border:3px solid #123;border-radius:16px;padding:15px;margin-bottom:14px;line-height:1.45}input{width:100%;padding:13px;border:3px solid #123;border-radius:10px;font-size:18px}button{width:100%;border:0;background:#123;color:white;border-radius:10px;padding:14px;margin-top:10px;font-weight:bold;cursor:pointer}.feedback{min-height:130px;background:#fff;border-left:8px solid #0a7a4b;border-radius:12px;padding:14px;line-height:1.45}@media(max-width:850px){main{grid-template-columns:1fr}.panel{border-left:0;border-top:5px solid #123}}
</style></head><body><div class="bank"><header><div><h1>Savings Interest Snowball</h1><p>Compare simple and compound interest choices. Grow the biggest money snowball.</p></div><div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">Round<b id="round">1</b></div></div></header><main><section class="hill"><div class="snowball" id="ball">£100</div><div class="track"><div class="coin c1">%</div><div class="coin c2">£</div><div class="coin c3">+</div></div><div class="choices" id="choices"></div></section><aside class="panel"><div class="card"><h2>Challenge</h2><p id="task"></p><p>Formula hint: compound total = principal × (1 + rate)<sup>years</sup>.</p></div><input id="answer" placeholder="Enter final value"><button id="check">Check Amount</button><button id="next">Next Challenge</button><div class="feedback" id="feedback">Choose the better savings option, then calculate the final amount.</div></aside></main></div><script>
const qs=[{p:100,r:.10,y:2,type:'compound',ans:121,task:'£100 at 10% compound interest for 2 years.'},{p:200,r:.05,y:3,type:'simple',ans:230,task:'£200 at 5% simple interest for 3 years.'},{p:500,r:.08,y:2,type:'compound',ans:583.2,task:'£500 at 8% compound interest for 2 years.'},{p:300,r:.06,y:4,type:'simple',ans:372,task:'£300 at 6% simple interest for 4 years.'}];let i=0,score=0;function load(){let q=qs[i];round.textContent=i+1;task.textContent=q.task;ball.textContent='£'+q.p;answer.value='';choices.innerHTML=['Simple interest','Compound interest','No interest'].map(x=>`<div class="choice">${x}</div>`).join('');document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('pick'));c.classList.add('pick')});feedback.textContent='Calculate the final value.'}
check.onclick=()=>{let q=qs[i],a=Number(answer.value);if(Math.abs(a-q.ans)<.6){score+=120;feedback.textContent='Correct. Final value is about £'+q.ans.toFixed(2)+'.'}else{score=Math.max(0,score-15);feedback.textContent='Not quite. Expected about £'+q.ans.toFixed(2)+'.'}document.getElementById('score').textContent=score};next.onclick=()=>{i=(i+1)%qs.length;load()};load();
</script></body></html>
