<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Debugging Detective Academy</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0b0f;color:#f8fafc;font-family:Consolas, Monaco, monospace;display:flex;align-items:center;justify-content:center;padding:18px;background-image:radial-gradient(circle at 20% 20%,rgba(234,179,8,.12),transparent 25%),linear-gradient(135deg,#050505,#111827 60%,#1f2937)}.app{width:min(1160px,100%);border:1px solid #3f3f46;background:#111827;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden}header{padding:24px;background:linear-gradient(90deg,#111827,#27272a);border-bottom:1px solid #3f3f46;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}h1{margin:0;color:#fde68a;font-size:clamp(28px,5vw,52px);text-shadow:0 0 18px rgba(250,204,21,.18)}.lead{margin:8px 0 0;color:#d4d4d8;line-height:1.45}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#050505;border:1px solid #3f3f46;color:#e4e4e7;padding:10px 12px;border-radius:14px}.stat b{color:#facc15;font-size:22px}.desk{display:grid;grid-template-columns:1fr .9fr;gap:18px;padding:20px}.casefile,.evidence{background:#18181b;border:1px solid #3f3f46;border-radius:18px;padding:18px}.caseTag{display:inline-block;background:#7f1d1d;color:#fecaca;border-radius:999px;padding:6px 10px;font-weight:900;margin-bottom:12px}.brief{font-family:Arial,sans-serif;line-height:1.5;color:#e5e7eb;background:#27272a;padding:14px;border-left:5px solid #facc15;border-radius:10px;margin-bottom:14px}.code{background:#030712;border:1px solid #374151;border-radius:14px;padding:16px;white-space:pre-wrap;line-height:1.55;color:#a7f3d0;min-height:250px;box-shadow:inset 0 0 30px rgba(16,185,129,.06)}.line{display:block}.ln{color:#71717a;margin-right:12px}.choices{display:grid;gap:12px}.choice{background:#27272a;border:1px solid #52525b;color:#fafafa;text-align:left;border-radius:14px;padding:14px;cursor:pointer;font:inherit;transition:.15s}.choice:hover{border-color:#facc15;transform:translateY(-2px)}.choice.correct{background:#064e3b;border-color:#34d399}.choice.wrong{background:#7f1d1d;border-color:#fca5a5}.feedback{margin-top:15px;padding:14px;min-height:88px;border-radius:14px;background:#09090b;border:1px dashed #52525b;line-height:1.45;color:#f4f4f5}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{background:#facc15;color:#18181b;border:0;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer}.secondary{background:#27272a;color:#fafafa;border:1px solid #52525b}.badgeRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.badge{border:1px solid #52525b;background:#09090b;border-radius:999px;padding:6px 9px;color:#d4d4d8;font-size:12px}.lamp{height:12px;background:linear-gradient(90deg,#7f1d1d,#facc15,#22c55e);border-radius:999px;overflow:hidden;margin-top:14px}.lamp div{height:100%;width:50%;background:rgba(255,255,255,.65);transition:.3s}@media(max-width:850px){header,.desk{grid-template-columns:1fr}.stats{grid-template-columns:repeat(4,1fr)}}@media(max-width:580px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><header><div><h1>Debugging Detective Academy</h1><p class="lead">Read the bug report, inspect the code, and identify the exact programming mistake. Each solved case improves your detective rank.</p></div><div class="stats"><span class="stat">Score<br><b id="score">0</b></span><span class="stat">Trust<br><b id="trust">60</b></span><span class="stat">Case<br><b id="round">1</b>/9</span><span class="stat">Streak<br><b id="streak">0</b></span></div></header><main class="desk"><section class="casefile"><span class="caseTag" id="tag">CASE</span><div class="badgeRow"><span class="badge" id="skill">Skill</span><span class="badge" id="difficulty">Difficulty</span></div><div class="brief" id="brief">Brief</div><div class="code" id="code"></div><div class="lamp"><div id="lamp"></div></div></section><section class="evidence"><h2>Choose the bug</h2><div class="choices" id="choices"></div><div class="feedback" id="feedback">Select the most precise diagnosis.</div><div class="tools"><button id="next">Start case</button><button class="secondary" id="reset">Reset academy</button></div></section></main></div><script>
const cases=[
{tag:'CASE 01',skill:'Variables',difficulty:'Easy',brief:'The program should increase the score, but it prints 10 instead of 11.',code:'let score = 10;\nscore + 1;\nconsole.log(score);',answer:'The expression score + 1 does not save the new value.',opts:['The expression score + 1 does not save the new value.','console.log can only print strings.','The variable should be called points.'],why:'Use score = score + 1 or score++ to update the stored value.'},
{tag:'CASE 02',skill:'Conditions',difficulty:'Easy',brief:'A player with 100 coins should unlock the door, but the message says locked.',code:'let coins = 100;\nif (coins > 100) {\n  console.log("Unlocked");\n} else {\n  console.log("Locked");\n}',answer:'The comparison excludes exactly 100; it should use >=.',opts:['The comparison excludes exactly 100; it should use >=.','The else block always runs first.','coins must be converted to text.'],why:'coins > 100 only works for 101 and above. coins >= 100 includes exactly 100.'},
{tag:'CASE 03',skill:'Loops',difficulty:'Medium',brief:'The loop should print 1, 2, 3, but it never stops.',code:'let i = 1;\nwhile (i <= 3) {\n  console.log(i);\n}',answer:'The loop counter is never changed inside the loop.',opts:['The loop counter is never changed inside the loop.','while loops cannot print numbers.','i should start at 0 only.'],why:'A while loop needs progress. Add i++ inside the loop.'},
{tag:'CASE 04',skill:'Arrays',difficulty:'Medium',brief:'The code should print the first item, apple, but prints banana.',code:'const fruits = ["apple", "banana", "pear"];\nconsole.log(fruits[1]);',answer:'Array indexes start at 0, so fruits[1] is the second item.',opts:['Array indexes start at 0, so fruits[1] is the second item.','Arrays must use round brackets.','The array has too many items.'],why:'fruits[0] is apple. Most programming arrays are zero-indexed.'},
{tag:'CASE 05',skill:'Functions',difficulty:'Medium',brief:'The function calculates the area, but the caller receives undefined.',code:'function area(width, height) {\n  width * height;\n}\nlet result = area(4, 5);\nconsole.log(result);',answer:'The function does not return the calculated value.',opts:['The function does not return the calculated value.','Function names cannot be lowercase.','The parameters must be named x and y.'],why:'Use return width * height; so the result leaves the function.'},
{tag:'CASE 06',skill:'Booleans',difficulty:'Medium',brief:'The game should end when health reaches 0, but it continues.',code:'let health = 0;\nlet isAlive = true;\nif (health === 0) {\n  isAlive === false;\n}',answer:'The code compares isAlive to false instead of assigning false.',opts:['The code compares isAlive to false instead of assigning false.','health cannot equal 0.','Booleans must be written TRUE and FALSE.'],why:'isAlive === false checks equality. isAlive = false changes the variable.'},
{tag:'CASE 07',skill:'Strings',difficulty:'Easy',brief:'The password check rejects the correct password typed as Secret.',code:'let input = "Secret";\nif (input === "secret") {\n  console.log("Access");\n}',answer:'The comparison is case-sensitive.',opts:['The comparison is case-sensitive.','Triple equals does not work with strings.','The if statement needs an else to work.'],why:'Secret and secret are different strings. Normalize case with input.toLowerCase() if needed.'},
{tag:'CASE 08',skill:'Logic',difficulty:'Hard',brief:'The shop discount should apply to students or seniors, but only applies if both are true.',code:'let isStudent = true;\nlet isSenior = false;\nif (isStudent && isSenior) {\n  console.log("Discount");\n}',answer:'The code uses AND instead of OR.',opts:['The code uses AND instead of OR.','Both variables should be strings.','The console ignores false values.'],why:'&& requires both conditions. Use || when either condition should be enough.'},
{tag:'CASE 09',skill:'Scope',difficulty:'Hard',brief:'The program crashes when printing bonus outside the if block.',code:'if (true) {\n  let bonus = 50;\n}\nconsole.log(bonus);',answer:'bonus was declared with block scope and is not available outside the block.',opts:['bonus was declared with block scope and is not available outside the block.','if true blocks never run.','console.log cannot print variables from if statements.'],why:'let and const are block-scoped. Declare bonus outside the block if it is needed later.'}
];
let idx=-1,score=0,trust=60,streak=0,locked=false;const $=id=>document.getElementById(id);
function numbered(code){return code.split('\n').map((line,i)=>'<span class="line"><span class="ln">'+String(i+1).padStart(2,'0')+'</span>'+line.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span>').join('')}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
function load(){locked=false;idx++;if(idx>=cases.length){finish();return;}const c=cases[idx];$('tag').textContent=c.tag;$('skill').textContent=c.skill;$('difficulty').textContent=c.difficulty;$('brief').textContent=c.brief;$('code').innerHTML=numbered(c.code);$('round').textContent=idx+1;$('score').textContent=score;$('trust').textContent=trust;$('streak').textContent=streak;$('lamp').style.width=trust+'%';$('feedback').textContent='Select the most precise diagnosis.';const box=$('choices');box.innerHTML='';shuffle(c.opts).forEach(opt=>{const b=document.createElement('button');b.className='choice';b.textContent=opt;b.onclick=()=>choose(b,opt,c);box.appendChild(b)});$('next').textContent='Skip case'}
function choose(btn,opt,c){if(locked)return;locked=true;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(opt===c.answer){streak++;const pts=120+streak*30;score+=pts;trust=Math.min(100,trust+6);btn.classList.add('correct');$('feedback').innerHTML='Solved. '+c.why+' <b>+'+pts+'</b> points.'}else{streak=0;trust=Math.max(0,trust-13);btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===c.answer)b.classList.add('correct')});$('feedback').innerHTML='Wrong diagnosis. '+c.why}$('score').textContent=score;$('trust').textContent=trust;$('streak').textContent=streak;$('lamp').style.width=trust+'%';$('next').textContent=idx===cases.length-1?'Graduate':'Next case'}
function finish(){const rank=score>1100?'Senior Debugging Detective':score>750?'Bug Hunter':'Trainee Debugger';$('brief').textContent='Academy review complete.';$('code').innerHTML='Final rank: '+rank+'\nScore: '+score+'\nTrust: '+trust+'\nKeep practising: read symptoms, inspect state, isolate the exact line.';$('choices').innerHTML='';$('feedback').textContent='Debugging is precise thinking: expected result, actual result, difference, cause, fix.';$('next').textContent='Restart';$('next').onclick=reset}
function reset(){idx=-1;score=0;trust=60;streak=0;$('next').onclick=load;load()}
$('next').onclick=load;$('reset').onclick=reset;
</script></body></html>
