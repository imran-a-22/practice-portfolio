<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Probability Tree Garden</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#8dd7ff 0 45%,#68ba63 45%);font-family:Trebuchet MS,system-ui,sans-serif;color:#183b20}.sun{position:fixed;right:8vw;top:5vh;width:150px;height:150px;border-radius:50%;background:#ffd84d;box-shadow:0 0 80px #ffe680;z-index:-1}.wrap{max-width:1160px;margin:auto;padding:26px}header{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}h1{font-size:clamp(35px,6vw,72px);margin:0;text-shadow:3px 3px 0 #ffffffaa}.tag{background:#ffffff99;border:3px solid #1d6b2b;border-radius:999px;padding:11px 18px;max-width:670px;line-height:1.4}.stats{display:flex;gap:8px}.seed{background:#fffbe8;border:4px solid #225b29;border-radius:22px;box-shadow:0 6px 0 #225b29;padding:9px 15px;text-align:center}.seed b{display:block;font-size:28px;color:#ad560e}.board{margin-top:22px;display:grid;grid-template-columns:1.15fr .85fr;gap:22px}.garden{background:linear-gradient(transparent 75%,#2e8b5755),repeating-linear-gradient(90deg,#ffffff22 0 24px,transparent 24px 48px);border:8px solid #225b29;border-radius:38px;box-shadow:0 20px 45px #0004;overflow:hidden}.panel{background:#fffbe8;border:8px solid #225b29;border-radius:38px;padding:22px;box-shadow:0 20px 45px #0004}.branch{stroke:#70451f;stroke-width:14;stroke-linecap:round}.twig{stroke:#70451f;stroke-width:8;stroke-linecap:round}.leaf{cursor:pointer;transition:.15s}.leaf:hover{transform:translateY(-3px)}.leaf circle{stroke:#17451f;stroke-width:4}.leaf.sel circle{stroke:#ffd84d;stroke-width:8}.leafText,.prob{font-weight:bold;text-anchor:middle;pointer-events:none}.leafText{font-size:16px;fill:#123b1d}.prob{font-size:15px;fill:#3e2815}.mission{border:4px dashed #9c6b21;border-radius:22px;background:#fff3bd;padding:16px}.mission h2{margin:0 0 8px;color:#8e4a00}.path{min-height:90px;background:#e3f7d4;border:4px solid #225b29;border-radius:22px;margin:15px 0;padding:13px;line-height:1.5}input{width:100%;border:4px solid #225b29;border-radius:16px;padding:13px;font-size:18px}button{border:0;border-radius:16px;background:#225b29;color:#fff;padding:13px 16px;font-weight:bold;cursor:pointer;box-shadow:0 6px 0 #133717;margin-top:10px}.feedback{min-height:80px;margin-top:12px;line-height:1.45}.lesson{background:#dcf4ff;border-left:9px solid #2b83b9;border-radius:16px;padding:12px;line-height:1.45;margin-top:14px}@media(max-width:900px){header,.board{grid-template-columns:1fr}.stats{flex-wrap:wrap}}
</style></head><body><div class="sun"></div><div class="wrap"><header><div><h1>Probability Tree Garden</h1><p class="tag">Select a final leaf, multiply along its branches, and master probability trees through garden missions.</p></div><div class="stats"><div class="seed">Seeds<b id="score">0</b></div><div class="seed">Level<b id="level">1</b></div><div class="seed">Streak<b id="streak">0</b></div></div></header><section class="board"><div class="garden"><svg viewBox="0 0 720 620"><line class="branch" x1="360" y1="560" x2="360" y2="370"/><line class="branch" x1="360" y1="370" x2="210" y2="220"/><line class="branch" x1="360" y1="370" x2="510" y2="220"/><line class="twig" x1="210" y1="220" x2="125" y2="95"/><line class="twig" x1="210" y1="220" x2="280" y2="95"/><line class="twig" x1="510" y1="220" x2="440" y2="95"/><line class="twig" x1="510" y1="220" x2="595" y2="95"/><text class="prob" id="p0" x="255" y="305"></text><text class="prob" id="p1" x="470" y="305"></text><text class="prob" id="p2" x="155" y="160"></text><text class="prob" id="p3" x="265" y="160"></text><text class="prob" id="p4" x="455" y="160"></text><text class="prob" id="p5" x="570" y="160"></text><g class="leaf" data-path="0"><circle cx="125" cy="85" r="48" fill="#f6a623"/><text class="leafText" id="l0" x="125" y="90"></text></g><g class="leaf" data-path="1"><circle cx="280" cy="85" r="48" fill="#6cc24a"/><text class="leafText" id="l1" x="280" y="90"></text></g><g class="leaf" data-path="2"><circle cx="440" cy="85" r="48" fill="#47b7e8"/><text class="leafText" id="l2" x="440" y="90"></text></g><g class="leaf" data-path="3"><circle cx="595" cy="85" r="48" fill="#e86d75"/><text class="leafText" id="l3" x="595" y="90"></text></g></svg></div><div class="panel"><div class="mission"><h2 id="mt">Mission</h2><div id="ms"></div></div><div class="path" id="path">No leaf selected.</div><input id="ans" placeholder="decimal e.g. 0.24"><button id="check">Check Answer</button><button id="next">Grow New Tree</button><div class="feedback" id="fb">Rule: multiply along one complete path.</div><div class="lesson"><b>Key idea:</b> AND along a tree = multiply. OR between separate final paths = add.</div></div></section></div><script>
var missions=[{t:'Weather Seeds',f:['Rain',.3,'No Rain',.7],s:{0:['Wind',.4,'Calm',.6],1:['Wind',.2,'Calm',.8]},ask:'Select Rain → Wind.',target:0},{t:'Snack Choice',f:['Fruit',.55,'Cake',.45],s:{0:['Apple',.7,'Banana',.3],1:['Chocolate',.65,'Vanilla',.35]},ask:'Select Cake → Chocolate.',target:2},{t:'Quiz Attempts',f:['Study',.8,'No Study',.2],s:{0:['Pass',.9,'Fail',.1],1:['Pass',.35,'Fail',.65]},ask:'Select No Study → Fail.',target:3},{t:'Factory Test',f:['A',.6,'B',.4],s:{0:['Good',.95,'Fault',.05],1:['Good',.85,'Fault',.15]},ask:'Select B → Fault.',target:3}];var mi=0,sel=null,score=0,streak=0,leaves=[].slice.call(document.querySelectorAll('.leaf'));function m(){return missions[mi]}function paths(){var x=m();return[{n:x.f[0]+' → '+x.s[0][0],p:x.f[1]*x.s[0][1],form:x.f[1]+' × '+x.s[0][1]},{n:x.f[0]+' → '+x.s[0][2],p:x.f[1]*x.s[0][3],form:x.f[1]+' × '+x.s[0][3]},{n:x.f[2]+' → '+x.s[1][0],p:x.f[3]*x.s[1][1],form:x.f[3]+' × '+x.s[1][1]},{n:x.f[2]+' → '+x.s[1][2],p:x.f[3]*x.s[1][3],form:x.f[3]+' × '+x.s[1][3]}]}function render(){var x=m(),p=paths();mt.textContent=x.t;ms.textContent=x.ask;p0.textContent=x.f[1];p1.textContent=x.f[3];p2.textContent=x.s[0][1];p3.textContent=x.s[0][3];p4.textContent=x.s[1][1];p5.textContent=x.s[1][3];p.forEach((a,i)=>document.getElementById('l'+i).textContent=a.n.split(' → ').map(z=>z[0]).join('-'));sel=null;path.textContent='No leaf selected.';ans.value='';level.textContent=mi+1;leaves.forEach(l=>l.classList.remove('sel'))}leaves.forEach(l=>l.onclick=function(){sel=+l.dataset.path;leaves.forEach(x=>x.classList.remove('sel'));l.classList.add('sel');var p=paths()[sel];path.innerHTML='<b>Selected:</b> '+p.n+'<br><b>Formula:</b> '+p.form+' = ?'});check.onclick=function(){if(sel===null){fb.textContent='Select a leaf first.';return}var p=paths()[sel],okPath=sel===m().target,okVal=Math.abs(+ans.value-p.p)<.001;if(okPath&&okVal){score+=120+streak*20;streak++;fb.textContent='Correct: '+p.form+' = '+p.p.toFixed(3)}else{score=Math.max(0,score-20);streak=0;fb.textContent=okPath?'Right leaf, wrong value: '+p.p.toFixed(3):'Wrong leaf. Read the mission path carefully.'}document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak};next.onclick=function(){mi=(mi+1)%missions.length;render();fb.textContent='New tree grown.'};render();
</script></body></html>
