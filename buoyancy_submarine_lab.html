<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Buoyancy Submarine Lab</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#5ec7ff 0,#07577c 48%,#021c2b 100%);font-family:Arial,sans-serif;color:#e8fbff;padding:18px}.app{max-width:1120px;margin:auto;border:5px solid #b7f7ff;border-radius:26px;background:rgba(1,17,28,.75);overflow:hidden;box-shadow:0 0 50px rgba(183,247,255,.25)}header{padding:22px;background:linear-gradient(90deg,#012034,#0b87a5);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{margin:0;font-size:clamp(28px,5vw,58px)}.stats{display:flex;gap:10px}.stat{background:#e8fbff;color:#012034;border-radius:14px;padding:9px 14px;text-align:center;min-width:85px}.stat b{display:block;font-size:28px}main{display:grid;grid-template-columns:1fr 340px;min-height:640px}.tank{position:relative;overflow:hidden;border-right:5px solid #b7f7ff;background:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 2px,transparent 2px 70px)}.depth{position:absolute;left:12px;top:25px;bottom:25px;width:55px;border-left:3px solid #b7f7ff}.mark{position:absolute;left:9px;font-size:13px}.sub{position:absolute;left:42%;top:240px;width:190px;height:75px;border:5px solid #e8fbff;border-radius:50px;background:linear-gradient(#ffce54,#f26b38);box-shadow:0 15px 25px rgba(0,0,0,.35);transition:.7s top}.sub:before{content:"";position:absolute;left:70px;top:-38px;width:60px;height:38px;border:5px solid #e8fbff;border-bottom:0;border-radius:18px 18px 0 0;background:#ffce54}.sub:after{content:"";position:absolute;right:-38px;top:20px;border-left:42px solid #f26b38;border-top:20px solid transparent;border-bottom:20px solid transparent}.bubble{position:absolute;border:2px solid #e8fbff;border-radius:50%;animation:rise 5s linear infinite;opacity:.75}.b1{left:22%;bottom:20px;width:22px;height:22px}.b2{left:62%;bottom:90px;width:15px;height:15px;animation-delay:1s}.b3{left:75%;bottom:30px;width:30px;height:30px;animation-delay:2s}@keyframes rise{to{transform:translateY(-650px);opacity:0}}.panel{padding:22px;background:#071f2d}.card{background:#0b3042;border:3px solid #7ee8ff;border-radius:18px;padding:16px;margin-bottom:15px;line-height:1.45}.controls label{display:block;margin:12px 0 6px}input[type=range]{width:100%}button{width:100%;border:0;border-radius:14px;background:#7ee8ff;color:#012034;padding:14px;font-weight:bold;cursor:pointer;margin-top:10px}.feedback{min-height:110px;background:#03121b;border-left:7px solid #ffce54;border-radius:12px;padding:12px;line-height:1.45}.read{font-size:22px;color:#ffce54}@media(max-width:850px){main{grid-template-columns:1fr}.tank{min-height:520px;border-right:0;border-bottom:5px solid #b7f7ff}}</style></head><body><div class="app"><header><div><h1>Buoyancy Submarine Lab</h1><p>Adjust mass and ballast volume. Predict whether the submarine floats, sinks, or hovers.</p></div><div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">Mission<b id="mission">1</b></div></div></header><main><section class="tank"><div class="depth"><span class="mark" style="top:0">0m</span><span class="mark" style="top:45%">50m</span><span class="mark" style="bottom:0">100m</span></div><div class="sub" id="sub"></div><div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div></section><aside class="panel"><div class="card"><h2 id="goal">Mission</h2><p id="task"></p><p class="read">Density: <span id="density">--</span> kg/m³</p></div><div class="card controls"><label>Mass: <span id="massTxt">900</span> kg</label><input id="mass" type="range" min="500" max="1600" value="900"><label>Displaced volume: <span id="volTxt">1.00</span> m³</label><input id="vol" type="range" min="50" max="160" value="100"></div><button id="test">Test Buoyancy</button><button id="next">Next Mission</button><div class="feedback" id="feedback">Water density is about 1000 kg/m³. Object density lower than water floats; higher sinks.</div></aside></main></div><script>const missions=[['Make the submarine float near the surface.','float'],['Make the submarine sink to the deep zone.','sink'],['Make the submarine hover mid-water: close to neutral buoyancy.','hover'],['Emergency rise: reduce density below water.','float']];let i=0,score=0;const mass=document.getElementById('mass'),vol=document.getElementById('vol');function sync(){massTxt.textContent=mass.value;volTxt.textContent=(vol.value/100).toFixed(2);let d=Number(mass.value)/(Number(vol.value)/100);density.textContent=Math.round(d);return d}function load(){mission.textContent=i+1;task.textContent=missions[i][0];sync();feedback.textContent='Tune mass and volume, then test.'}mass.oninput=vol.oninput=sync;test.onclick=()=>{let d=sync(),state=d<970?'float':d>1030?'sink':'hover',target=missions[i][1];sub.style.top=state==='float'?'80px':state==='sink'?'470px':'250px';if(state===target){score+=120;feedback.textContent='Correct: density '+Math.round(d)+' kg/m³ makes it '+state+'.'}else{score=Math.max(0,score-15);feedback.textContent='Not yet. It would '+state+'. Target is '+target+'. Adjust density relative to water.'}document.getElementById('score').textContent=score};next.onclick=()=>{i=(i+1)%missions.length;load()};load();</script></body></html>
