<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Volcano Evacuation Planner</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#25100a;color:#fff1dd;font-family:Arial,sans-serif;padding:18px}.app{max-width:1160px;margin:auto;background:#3b170e;border:6px solid #ffb84d;border-radius:22px;overflow:hidden;box-shadow:0 0 60px rgba(255,82,0,.28)}header{padding:22px;background:linear-gradient(90deg,#2a0803,#ff5200);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{margin:0;font-size:clamp(30px,5vw,60px)}.stats{display:flex;gap:8px}.stat{background:#fff1dd;color:#2a0803;border-radius:12px;padding:9px 13px;text-align:center;min-width:85px}.stat b{display:block;font-size:27px}main{display:grid;grid-template-columns:1fr 340px;min-height:650px}.map{position:relative;background:#6b3d1f;overflow:hidden;border-right:6px solid #ffb84d}.volcano{position:absolute;left:50%;top:60px;transform:translateX(-50%);width:220px;height:210px;background:linear-gradient(135deg,#2e1b14,#8a3b1d);clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 12px 20px rgba(0,0,0,.4))}.lava{position:absolute;left:50%;top:45px;transform:translateX(-50%);width:54px;height:80px;background:#ffea00;border-radius:0 0 25px 25px;box-shadow:0 0 30px #ff5200}.zone{position:absolute;border-radius:50%;left:50%;top:170px;transform:translate(-50%,-50%);border:4px dashed}.red{width:330px;height:330px;border-color:#ff3b30;background:rgba(255,59,48,.2)}.orange{width:500px;height:500px;border-color:#ffb84d;background:rgba(255,184,77,.14)}.green{width:680px;height:680px;border-color:#67d56b;background:rgba(103,213,107,.08)}.town{position:absolute;width:92px;height:74px;border:3px solid #fff1dd;border-radius:12px;background:#1c2733;display:grid;place-items:center;text-align:center;font-weight:bold;cursor:pointer}.town:hover,.town.pick{outline:6px solid #00e5ff}.t1{left:80px;top:360px}.t2{right:90px;top:360px}.t3{left:250px;bottom:70px}.t4{right:250px;bottom:90px}.route{position:absolute;height:8px;background:#00e5ff;transform-origin:left;display:none}.panel{background:#21100a;padding:22px}.card{background:#34160d;border:3px solid #ffb84d;border-radius:18px;padding:16px;margin-bottom:14px;line-height:1.45}.choices{display:grid;gap:10px}.choices button{border:0;border-radius:13px;background:#ffb84d;color:#25100a;padding:13px;font-weight:bold;cursor:pointer;text-align:left}.feedback{min-height:130px;background:#130704;border-left:7px solid #00e5ff;border-radius:12px;padding:12px;line-height:1.45}@media(max-width:850px){main{grid-template-columns:1fr}.map{min-height:560px;border-right:0;border-bottom:6px solid #ffb84d}}</style></head><body><div class="app"><header><div><h1>Volcano Evacuation Planner</h1><p>Read hazard zones and choose the safest evacuation decision before eruption conditions worsen.</p></div><div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">Case<b id="caseNo">1</b></div><div class="stat">Lives<b id="lives">100</b></div></div></header><main><section class="map"><div class="zone green"></div><div class="zone orange"></div><div class="zone red"></div><div class="volcano"></div><div class="lava"></div><div class="town t1" data-town="Ashford">Ashford</div><div class="town t2" data-town="Ridgeview">Ridgeview</div><div class="town t3" data-town="Safeport">Safeport</div><div class="town t4" data-town="River Camp">River Camp</div></section><aside class="panel"><div class="card"><h2 id="title">Emergency Brief</h2><p id="brief"></p></div><div class="choices" id="choices"></div><button id="next" style="margin-top:12px;width:100%;border:0;border-radius:13px;background:#00e5ff;color:#25100a;padding:13px;font-weight:bold">Next Brief</button><div class="feedback" id="feedback">Select the best evacuation action.</div></aside></main></div><script>const cases=[{brief:'Lava risk is highest in the red zone. Which town must evacuate first?',answer:'Evacuate Ashford',why:'Ashford is closest to the red zone, so immediate evacuation has priority.'},{brief:'Ash cloud is moving east. Which town needs masks and shelter guidance?',answer:'Warn Ridgeview',why:'Ridgeview is downwind/east of the volcano, so ashfall guidance is urgent.'},{brief:'The bridge north is blocked. Where should evacuees gather?',answer:'Move to Safeport',why:'Safeport is outside the main hazard rings and works as a safer assembly area.'},{brief:'Mudflow risk follows river valleys after heavy rain. Which site is unsafe?',answer:'Clear River Camp',why:'Lahars/mudflows travel along river channels, so river camps are dangerous.'}];let i=0,score=0,lives=100;function load(){caseNo.textContent=i+1;brief.textContent=cases[i].brief;choices.innerHTML=['Evacuate Ashford','Warn Ridgeview','Move to Safeport','Clear River Camp'].map(x=>'<button>'+x+'</button>').join('');document.querySelectorAll('#choices button').forEach(b=>b.onclick=()=>ans(b.textContent));feedback.textContent='Use distance, wind, and river valleys to decide.'}function ans(x){let c=cases[i];if(x===c.answer){score+=130;feedback.textContent='Correct. '+c.why}else{lives-=15;score=Math.max(0,score-20);feedback.textContent='Risky choice. Best answer: '+c.answer+'. '+c.why}document.getElementById('score').textContent=score;document.getElementById('lives').textContent=Math.max(0,lives)}next.onclick=()=>{i=(i+1)%cases.length;load()};load();</script></body></html>
