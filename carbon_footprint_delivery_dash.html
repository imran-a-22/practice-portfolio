<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Carbon Footprint Delivery Dash</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#171717;color:#f4f1e8;font-family:Arial,sans-serif;padding:18px}.app{max-width:1160px;margin:auto;border:5px solid #f4f1e8;background:#202020;box-shadow:14px 14px 0 #55d66b}header{padding:22px;background:#55d66b;color:#102415;display:grid;grid-template-columns:1fr auto;gap:16px}h1{margin:0;font-size:clamp(30px,5vw,58px);font-weight:900}.tag{font-size:18px;max-width:680px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#102415;color:#f4f1e8;padding:10px 14px;border-radius:8px;text-align:center;min-width:90px}.stat b{display:block;font-size:28px;color:#55d66b}main{display:grid;grid-template-columns:1fr 360px;min-height:640px}.map{padding:24px;background:#2d2d2d;position:relative;overflow:hidden}.roads{height:520px;border:4px solid #777;background:linear-gradient(90deg,#3b3b3b 49%,#e8d76f 49% 51%,#3b3b3b 51%);border-radius:14px;position:relative}.node{position:absolute;width:105px;height:105px;border-radius:22px;border:4px solid #f4f1e8;background:#111;display:grid;place-items:center;text-align:center;font-weight:bold}.warehouse{left:40px;top:205px;background:#3357ff}.shop{right:50px;top:80px;background:#9b42ff}.school{right:80px;bottom:70px;background:#ff8b2b}.park{left:250px;top:60px;background:#0d8b50}.co2cloud{position:absolute;border:3px solid #f4f1e8;border-radius:50%;background:#555;padding:16px;animation:pulse 2s infinite}.c1{left:250px;bottom:90px}.c2{right:220px;top:250px}@keyframes pulse{50%{transform:scale(1.08);opacity:.7}}.side{border-left:5px solid #f4f1e8;padding:22px;background:#111}.mission{background:#202020;border:3px solid #55d66b;padding:16px;margin-bottom:16px}.options{display:grid;gap:12px}.option{border:3px solid #f4f1e8;background:#2d2d2d;color:#f4f1e8;padding:14px;border-radius:10px;cursor:pointer;text-align:left}.option:hover{background:#3a3a3a}.option.pick{outline:5px solid #55d66b}.bars{margin:16px 0}.bar{background:#333;border:2px solid #777;height:26px;margin:8px 0;position:relative}.fill{height:100%;background:#55d66b;width:50%}.fill.cost{background:#ffcf4a}.fill.time{background:#4ab3ff}button{width:100%;border:0;background:#55d66b;color:#102415;font-weight:900;padding:15px;border-radius:10px;cursor:pointer}.feedback{min-height:120px;line-height:1.5;background:#202020;border-left:7px solid #55d66b;padding:14px;margin-top:14px}@media(max-width:850px){header,main{grid-template-columns:1fr}.side{border-left:0;border-top:5px solid #f4f1e8}}</style></head><body><div class="app"><header><div><h1>Carbon Footprint Delivery Dash</h1><div class="tag">Run a delivery business. Choose transport and packaging that balance CO₂, cost, and customer time.</div></div><div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">CO₂ Saved<b id="saved">0</b></div><div class="stat">Round<b id="round">1</b></div></div></header><main><section class="map"><div class="roads"><div class="node warehouse">Warehouse</div><div class="node shop">Shop</div><div class="node school">School</div><div class="node park">Park</div><div class="co2cloud c1">CO₂</div><div class="co2cloud c2">CO₂</div></div></section><aside class="side"><div class="mission"><h2 id="title">Delivery Brief</h2><p id="brief"></p></div><div class="options" id="options"></div><div class="bars"><div>Carbon</div><div class="bar"><div id="carbonBar" class="fill"></div></div><div>Cost</div><div class="bar"><div id="costBar" class="fill cost"></div></div><div>Time</div><div class="bar"><div id="timeBar" class="fill time"></div></div></div><button id="submit">Dispatch Choice</button><button id="next" style="margin-top:10px;background:#f4f1e8">Next Contract</button><div class="feedback" id="feedback">Pick a delivery plan.</div></aside></main></div><script>const rounds=[{brief:'Deliver 20 small parcels within the same neighbourhood.',best:'Cargo bike',opts:[['Diesel van',85,40,35],['Cargo bike',12,25,45],['Motorbike',48,32,30]],why:'Cargo bikes are efficient for short urban routes and create very low direct emissions.'},{brief:'Deliver one urgent medical box across town.',best:'Electric van',opts:[['Electric van',25,55,25],['Walking courier',5,10,90],['Diesel van',80,40,23]],why:'The electric van keeps delivery fast while reducing emissions compared with diesel.'},{brief:'Send fragile products with packaging.',best:'Recycled cardboard',opts:[['Plastic foam',60,25,20],['Recycled cardboard',20,28,22],['Oversized box',55,35,20]],why:'Right-sized recycled packaging cuts material waste and emissions.'},{brief:'Restock three shops in one area.',best:'Consolidated route',opts:[['Three separate trips',95,75,60],['Consolidated route',38,52,70],['Fastest route only',70,62,45]],why:'Combining deliveries reduces duplicated mileage.'}];let i=0,pick=null,score=0,saved=0;function load(){const r=rounds[i];document.getElementById('round').textContent=i+1;document.getElementById('brief').textContent=r.brief;pick=null;document.getElementById('options').innerHTML=r.opts.map((o,k)=>'<div class="option" data-k="'+k+'"><b>'+o[0]+'</b><br>CO₂ '+o[1]+'kg | Cost £'+o[2]+' | Time '+o[3]+'min</div>').join('');document.querySelectorAll('.option').forEach(el=>el.onclick=()=>select(Number(el.dataset.k),el));document.getElementById('feedback').textContent='Pick a delivery plan.';bars(50,50,50)}function select(k,el){pick=k;document.querySelectorAll('.option').forEach(x=>x.classList.remove('pick'));el.classList.add('pick');let o=rounds[i].opts[k];bars(o[1],o[2],o[3])}function bars(c,cost,t){document.getElementById('carbonBar').style.width=Math.min(c,100)+'%';document.getElementById('costBar').style.width=Math.min(cost,100)+'%';document.getElementById('timeBar').style.width=Math.min(t,100)+'%'}document.getElementById('submit').onclick=()=>{if(pick===null){feedback.textContent='Choose an option first.';return}const r=rounds[i],o=r.opts[pick];if(o[0]===r.best){score+=140;saved+=Math.max(...r.opts.map(x=>x[1]))-o[1];feedback.textContent='Best choice. '+r.why}else{score=Math.max(0,score-20);feedback.textContent='Not ideal. Best choice: '+r.best+'. '+r.why}document.getElementById('score').textContent=score;document.getElementById('saved').textContent=saved};document.getElementById('next').onclick=()=>{i=(i+1)%rounds.length;load()};load();</script></body></html>
