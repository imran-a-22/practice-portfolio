<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Palace Vocab Vault</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 15%,#fff5c8,transparent 24%),linear-gradient(135deg,#4a2618,#110807);font-family:Georgia,serif;color:#2d160b;display:grid;place-items:center;padding:22px}.game{width:min(1120px,100%);border:9px solid #3b1c0e;border-radius:28px;background:#f7df9f;box-shadow:0 30px 70px #0009;overflow:hidden}header{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:22px;background:repeating-linear-gradient(90deg,#f5d37b 0 24px,#f9e5a8 24px 48px);border-bottom:6px solid #3b1c0e}h1{margin:0;font-size:clamp(30px,5vw,60px)}.sub{max-width:650px;line-height:1.35}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#fff9dc;border:4px solid #3b1c0e;border-radius:18px;padding:8px 14px;text-align:center;box-shadow:4px 5px 0 #0003}.stat b{font-size:28px;display:block}.main{display:grid;grid-template-columns:1.1fr .9fr}.map{padding:28px;background:repeating-linear-gradient(45deg,#b8794f 0 18px,#c99362 18px 36px)}.plan{position:relative;height:520px;border:8px double #3b1c0e;border-radius:24px;background:#efd18a;box-shadow:inset 0 0 50px #0003}.hall{position:absolute;inset:170px 210px 140px;background:#7b4325;border:5px solid #3b1c0e;border-radius:18px;color:#fff4cf;display:grid;place-items:center;text-align:center;font-weight:bold;font-size:22px}.room{position:absolute;border:5px solid #3b1c0e;border-radius:18px;padding:12px;background:#fff2bd;box-shadow:6px 7px 0 #0003;cursor:pointer;transition:.15s}.room:hover,.room.on{transform:translateY(-4px);outline:6px solid #fff}.done{outline:6px solid #2e8b57!important}.room span{display:block;text-align:center;font-size:42px;margin:12px}.r0{left:24px;top:24px;width:245px;height:150px}.r1{right:24px;top:24px;width:245px;height:150px;background:#d8e9ff}.r2{left:24px;bottom:24px;width:245px;height:150px;background:#dbf4c7}.r3{right:24px;bottom:24px;width:245px;height:150px;background:#ffd1dc}.r4{left:330px;bottom:24px;width:200px;height:125px;background:#eadbff}.panel{padding:26px;background:#fff7d8;border-left:6px solid #3b1c0e}.card{background:#fffdf1;border:4px solid #3b1c0e;border-radius:22px;padding:18px;box-shadow:7px 8px 0 #0002;margin-bottom:14px}.word{font-size:42px;color:#8b1e3f;margin:4px 0}.def{font-size:20px;line-height:1.45;min-height:80px}.choices{display:grid;gap:10px}button{border:0;border-radius:16px;background:#315c88;color:#fff;padding:13px 15px;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #17334f}.choice{text-align:left}.good{background:#23714f!important}.bad{background:#9b2636!important}.note{font-family:system-ui,sans-serif;line-height:1.45;background:#f1d791;border-left:8px solid #bd7b22;padding:12px;border-radius:12px}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls button{background:#4b2717}@media(max-width:900px){.main{grid-template-columns:1fr}.panel{border-left:0;border-top:6px solid #3b1c0e}.plan{height:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}.room,.hall{position:static;width:auto!important;height:120px;inset:auto}}
</style></head><body><div class="game"><header><div><h1>Memory Palace Vocab Vault</h1><div class="sub">Learn advanced words by placing memorable images inside rooms, then recall the definitions from the palace route.</div></div><div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">Streak<b id="streak">0</b></div><div class="stat">Found<b id="found">0</b></div></div></header><div class="main"><section class="map"><div class="plan"><div class="hall">Grand Hall<br>location + image + meaning</div><div class="room r0" data-i="0">Library<span>📚</span></div><div class="room r1" data-i="1">Observatory<span>🔭</span></div><div class="room r2" data-i="2">Kitchen<span>🍯</span></div><div class="room r3" data-i="3">Gallery<span>🖼️</span></div><div class="room r4" data-i="4">Vault<span>🗝️</span></div></div></section><section class="panel"><div class="card"><small id="mode">Study mode</small><div class="word" id="word"></div><div class="def" id="def"></div></div><div class="note" id="feedback"></div><div class="choices" id="choices"></div><div class="controls"><button id="recall">Begin Recall</button><button id="hint">Memory Hint</button><button id="reset">New Route</button></div></section></div></div><script>
var sets=[[['Ephemeral','Lasting for a very short time.','A butterfly vanishes between books.'],['Meticulous','Extremely careful and detailed.','A telescope lens is polished dot by dot.'],['Abundant','More than enough; plentiful.','Honey pours from every jar.'],['Ambiguous','Open to more than one meaning.','A portrait smiles and frowns.'],['Fortify','To strengthen or protect.','A shield locks over the chest.']],[['Concise','Clear but brief.','Scissors cut a paragraph into one line.'],['Infer','To conclude from evidence.','Footprints cross a star map.'],['Scarce','Limited; not enough.','One spoon sits in an empty cupboard.'],['Vivid','Bright, clear and detailed.','Paint bursts from the frame.'],['Preserve','Keep safe or unchanged.','An old vase is sealed in glass.']]];
var si=0,idx=0,score=0,streak=0,recall=false,q=null,done={};var rooms=[].slice.call(document.querySelectorAll('.room')),choices=document.getElementById('choices');function data(){return sets[si]}function sync(){scoreEl.textContent=score;streakEl.textContent=streak;found.textContent=Object.keys(done).length}var scoreEl=document.getElementById('score'),streakEl=document.getElementById('streak'),found=document.getElementById('found');function study(i){recall=false;idx=i;choices.innerHTML='';rooms.forEach(function(r){r.classList.toggle('on',+r.dataset.i===i)});var x=data()[i];word.textContent=x[0];def.textContent=x[1]+' Clue: '+x[2];mode.textContent='Study mode';feedback.textContent='Place this clue in the '+rooms[i].childNodes[0].textContent+' and picture it clearly.'}function begin(){recall=true;choices.innerHTML='';var left=data().map(function(_,i){return i}).filter(function(i){return !done[i]});if(!left.length){word.textContent='Vault Opened';def.textContent='You completed the palace. Score: '+score;feedback.textContent='Strong recall comes from vivid location links.';return}var i=left[Math.floor(Math.random()*left.length)];q=i;word.textContent='Recall: '+data()[i][0];def.textContent='Choose the correct meaning from memory.';mode.textContent='Recall challenge';data().map(x=>x[1]).sort(()=>Math.random()-.5).forEach(function(d){var b=document.createElement('button');b.className='choice';b.textContent=d;b.onclick=function(){answer(d,b)};choices.appendChild(b)});feedback.textContent='Think of the room image before choosing.'}function answer(d,b){var ok=d===data()[q][1];[].slice.call(document.querySelectorAll('.choice')).forEach(x=>x.disabled=true);if(ok){score+=100+streak*15;streak++;done[q]=1;b.classList.add('good');rooms[q].classList.add('done');feedback.textContent='Correct. Clue: '+data()[q][2]}else{score=Math.max(0,score-25);streak=0;b.classList.add('bad');feedback.textContent='Correct answer: '+data()[q][1]+' Clue: '+data()[q][2]}sync();setTimeout(begin,1300)}rooms.forEach(r=>r.onclick=()=>study(+r.dataset.i));recall.onclick=begin;hint.onclick=()=>feedback.textContent='Hint: '+(recall?data()[q][2]:data()[idx][2]);reset.onclick=function(){si=(si+1)%sets.length;done={};score=0;streak=0;rooms.forEach(r=>r.classList.remove('done'));sync();study(0)};study(0);sync();
</script></body></html>
