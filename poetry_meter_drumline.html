<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Poetry Meter Drumline</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f6ead4;color:#24140d;font-family:Georgia,serif;padding:18px}.stage{max-width:1120px;margin:auto;border:8px solid #24140d;background:#fff8e8;box-shadow:15px 15px 0 #cc3f2f;overflow:hidden}header{padding:24px;background:#f2b84b;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:clamp(32px,5vw,62px);margin:0}.stats{display:flex;gap:8px}.stat{background:#24140d;color:#fff8e8;padding:9px 14px;text-align:center}.stat b{display:block;color:#f2b84b;font-size:28px}
main{display:grid;grid-template-columns:1fr 350px;min-height:620px}.drums{padding:28px;background:linear-gradient(#fff8e8,#f4d8a8)}.line{font-size:32px;line-height:1.35;background:white;border:4px solid #24140d;padding:22px;margin:18px 0;box-shadow:8px 8px 0 rgba(0,0,0,.15)}.beats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}.beat{width:86px;height:86px;border-radius:50%;border:5px solid #24140d;background:#cc3f2f;color:white;display:grid;place-items:center;font-size:24px;font-weight:bold;box-shadow:0 8px 0 #24140d;cursor:pointer}.beat.soft{background:#4b83cc}.beat:hover{transform:translateY(-4px)}.panel{border-left:8px solid #24140d;padding:22px;background:#fff}.card{border:3px solid #24140d;padding:15px;margin-bottom:14px;background:#fff8e8;line-height:1.45}.options{display:grid;gap:10px}button{border:3px solid #24140d;background:white;padding:14px;font-weight:bold;cursor:pointer;text-align:left}button:hover{background:#f2b84b}.feedback{min-height:130px;background:#f4d8a8;border-left:8px solid #cc3f2f;padding:14px;line-height:1.45}@media(max-width:850px){main{grid-template-columns:1fr}.panel{border-left:0;border-top:8px solid #24140d}}
</style></head><body><div class="stage"><header><div><h1>Poetry Meter Drumline</h1><p>Feel the beat of poetry. Identify stress patterns like iamb and trochee.</p></div><div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">Line<b id="level">1</b></div></div></header><main><section class="drums"><div class="line" id="poem"></div><div class="beats"><div class="beat soft">da</div><div class="beat">DUM</div><div class="beat soft">da</div><div class="beat">DUM</div><div class="beat soft">da</div><div class="beat">DUM</div></div></section><aside class="panel"><div class="card"><h2>Mission</h2><p>Choose the meter pattern that best matches the line.</p></div><div class="options" id="options"></div><button id="next" style="margin-top:10px;background:#24140d;color:white">Next Line</button><div class="feedback" id="feedback">Iamb = unstressed then stressed: da-DUM. Trochee = stressed then unstressed: DUM-da.</div></aside></main></div><script>
const qs=[{line:'I walked alone beneath the moon',ans:'Iambic',why:'The rhythm leans toward da-DUM beats.'},{line:'Tiger, tiger, burning bright',ans:'Trochaic',why:'The line starts strongly: DUM-da style.'},{line:'Over the silent water',ans:'Dactylic',why:'Dactyl sounds like DUM-da-da.'},{line:'In the stillness, dreams awaken',ans:'Mixed meter',why:'The stress pattern shifts rather than staying perfectly regular.'}];let i=0,score=0;const opts=['Iambic','Trochaic','Dactylic','Mixed meter'];function load(){level.textContent=i+1;poem.textContent='“'+qs[i].line+'”';options.innerHTML=opts.map(o=>`<button>${o}</button>`).join('');document.querySelectorAll('#options button').forEach(b=>b.onclick=()=>choose(b.textContent));feedback.textContent='Listen to the stress pattern.'}
function choose(o){let q=qs[i];if(o===q.ans){score+=100;feedback.textContent='Correct. '+q.why}else{score=Math.max(0,score-15);feedback.textContent='Not quite. Best answer: '+q.ans+'. '+q.why}document.getElementById('score').textContent=score}next.onclick=()=>{i=(i+1)%qs.length;load()};load();
</script></body></html>
