<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Probability Tree Explorer</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial Rounded MT Bold,Arial,sans-serif;background:#0f172a;color:#e0f2fe;display:flex;align-items:center;justify-content:center;padding:18px;background-image:radial-gradient(circle at top,#1e3a8a,transparent 40%),linear-gradient(135deg,#020617,#0f172a)}.game{width:min(1180px,100%);background:rgba(15,23,42,.86);border:1px solid rgba(147,197,253,.25);border-radius:30px;box-shadow:0 28px 80px rgba(0,0,0,.48);overflow:hidden}header{padding:26px;background:linear-gradient(135deg,rgba(59,130,246,.35),rgba(168,85,247,.22));display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}h1{margin:0;font-size:clamp(30px,5vw,56px);letter-spacing:-1px}.lead{margin:8px 0 0;color:#c7d2fe;line-height:1.45}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#020617;border:1px solid rgba(147,197,253,.25);border-radius:18px;padding:10px 14px}.stat b{display:block;color:#f0abfc;font-size:24px}.main{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;padding:22px}.tree,.panel{background:rgba(2,6,23,.55);border:1px solid rgba(147,197,253,.18);border-radius:24px;padding:20px}.treeCanvas{height:430px;border-radius:20px;background:radial-gradient(circle at center,rgba(59,130,246,.18),rgba(2,6,23,.45));position:relative;overflow:hidden;border:1px solid rgba(147,197,253,.15)}.node{position:absolute;width:92px;height:58px;border-radius:18px;background:#172554;border:2px solid #60a5fa;display:grid;place-items:center;text-align:center;font-size:13px;font-weight:900;box-shadow:0 0 24px rgba(96,165,250,.18)}.start{left:36px;top:185px}.n1{left:245px;top:95px}.n2{left:245px;top:275px}.n3{left:470px;top:45px}.n4{left:470px;top:145px}.n5{left:470px;top:245px}.n6{left:470px;top:345px}.branch{position:absolute;height:4px;background:#93c5fd;transform-origin:left center;border-radius:99px}.label{position:absolute;background:#020617;border:1px solid #334155;border-radius:999px;padding:5px 8px;font-size:12px;color:#bae6fd}.mission{background:#111827;border-left:6px solid #a855f7;border-radius:18px;padding:16px;line-height:1.5}.question{font-size:21px;color:#f5d0fe;margin:0 0 8px}.answerArea{display:grid;grid-template-columns:1fr auto;gap:10px;margin:16px 0}input{padding:14px;border-radius:16px;border:2px solid #475569;background:#020617;color:#e0f2fe;font-size:18px}button{border:0;border-radius:16px;padding:13px 16px;font-weight:900;cursor:pointer;background:#a855f7;color:white}.secondary{background:#1e293b;border:1px solid #475569}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.chip{background:#1e293b;border:1px solid #475569;border-radius:16px;padding:12px;text-align:center;cursor:pointer}.chip:hover{border-color:#a855f7}.feedback{margin-top:15px;min-height:94px;line-height:1.45;background:#020617;border:1px dashed #475569;border-radius:18px;padding:14px}.formula{font-family:Consolas,monospace;background:#172554;border-radius:14px;padding:12px;margin-top:14px;color:#dbeafe}.bar{height:14px;background:#020617;border-radius:999px;border:1px solid #334155;margin-top:14px;overflow:hidden}.bar div{height:100%;width:0;background:linear-gradient(90deg,#60a5fa,#f0abfc);transition:.3s}@media(max-width:900px){header,.main{grid-template-columns:1fr}.treeCanvas{height:360px}.node{transform:scale(.82);transform-origin:center}.n1,.n2{left:190px}.n3,.n4,.n5,.n6{left:340px}}
</style></head><body><div class="game"><header><div><h1>Probability Tree Explorer</h1><p class="lead">Build intuition for probability trees. Multiply along branches, add separate successful paths, and convert fractions to decimals.</p></div><div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">Energy<b id="energy">100</b></div><div class="stat">Puzzle<b id="round">1/8</b></div></div></header><main class="main"><section class="tree"><div class="treeCanvas" id="treeCanvas"><div class="node start">Start</div><div class="node n1" id="aNode">A</div><div class="node n2" id="bNode">B</div><div class="node n3" id="aaNode">AA</div><div class="node n4" id="abNode">AB</div><div class="node n5" id="baNode">BA</div><div class="node n6" id="bbNode">BB</div></div><div class="bar"><div id="progress"></div></div></section><section class="panel"><div class="mission"><p class="question" id="question">Question</p><div id="details"></div><div class="formula" id="formula">Multiply along a path.</div><div class="answerArea"><input id="answer" placeholder="e.g. 0.25 or 1/4"/><button id="check">Check</button></div><div class="choices" id="quickChoices"></div><div class="feedback" id="feedback">Use the tree to solve the probability mission.</div><div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap"><button class="secondary" id="next">Next puzzle</button><button class="secondary" id="reset">Reset</button></div></div></section></main></div><script>
const puzzles=[
{context:'A bag has 3 red and 2 blue counters. Two counters are picked with replacement.',p1:.6,p2:.4,q:'What is P(red then blue)?',ans:.24,why:'Replacement means probabilities stay 3/5 and 2/5. Multiply: 0.6 × 0.4 = 0.24.',labels:['Red','Blue']},
{context:'A spinner has P(win)=0.25 and P(lose)=0.75. Spin twice.',p1:.25,p2:.75,q:'What is P(win then win)?',ans:.0625,why:'Multiply along the win-win branch: 0.25 × 0.25 = 0.0625.',labels:['Win','Lose']},
{context:'Weather forecast: P(sun)=0.7, P(rain)=0.3. Consider two independent days.',p1:.7,p2:.3,q:'What is P(exactly one rainy day)?',ans:.42,why:'Rain then sun is 0.3 × 0.7. Sun then rain is 0.7 × 0.3. Add: 0.21 + 0.21 = 0.42.',labels:['Sun','Rain'],exactlyOne:true},
{context:'A free trial user converts with probability 0.2. Two users visit independently.',p1:.2,p2:.8,q:'What is P(at least one conversion)?',ans:.36,why:'At least one = convert-convert + convert-no + no-convert = .04 + .16 + .16 = .36. Or 1 - .8×.8.',labels:['Convert','No']},
{context:'A card is drawn from a mini deck: P(ace)=0.1, P(not ace)=0.9. Draw twice with replacement.',p1:.1,p2:.9,q:'What is P(no aces)?',ans:.81,why:'No ace then no ace: 0.9 × 0.9 = 0.81.',labels:['Ace','Not']},
{context:'A quiz guess has P(correct)=0.5. Two questions are guessed independently.',p1:.5,p2:.5,q:'What is P(exactly one correct)?',ans:.5,why:'Correct-wrong is .25 and wrong-correct is .25. Add them: .5.',labels:['Correct','Wrong'],exactlyOne:true},
{context:'A machine passes inspection with probability 0.8. Two machines are checked.',p1:.8,p2:.2,q:'What is P(both pass)?',ans:.64,why:'Pass then pass: 0.8 × 0.8 = 0.64.',labels:['Pass','Fail']},
{context:'A seed germinates with probability 0.65. Two seeds are planted.',p1:.65,p2:.35,q:'What is P(at least one germinates)?',ans:.8775,why:'Use complement: 1 - P(none) = 1 - 0.35×0.35 = 0.8775.',labels:['Grow','No']}
];
let i=0,score=0,energy=100,answered=false;const $=id=>document.getElementById(id);function fracOrNum(v){return Math.round(v*10000)/10000}function parseAns(s){s=s.trim();if(s.includes('/')){let [a,b]=s.split('/').map(Number);return a/b}return Number(s)}
function branch(x1,y1,x2,y2,text){const c=$('treeCanvas'),dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;let line=document.createElement('div');line.className='branch';line.style.left=x1+'px';line.style.top=y1+'px';line.style.width=len+'px';line.style.transform='rotate('+ang+'deg)';c.appendChild(line);let lab=document.createElement('div');lab.className='label';lab.textContent=text;lab.style.left=(x1+dx*.45)+'px';lab.style.top=(y1+dy*.45-25)+'px';c.appendChild(lab)}
function draw(p){document.querySelectorAll('.branch,.label').forEach(e=>e.remove());$('aNode').textContent=p.labels[0];$('bNode').textContent=p.labels[1];$('aaNode').textContent=p.labels[0]+'-'+p.labels[0];$('abNode').textContent=p.labels[0]+'-'+p.labels[1];$('baNode').textContent=p.labels[1]+'-'+p.labels[0];$('bbNode').textContent=p.labels[1]+'-'+p.labels[1];branch(128,214,245,124,p.p1);branch(128,214,245,304,p.p2);branch(337,124,470,74,p.p1);branch(337,124,470,174,p.p2);branch(337,304,470,274,p.p1);branch(337,304,470,374,p.p2)}
function choices(ans){const vals=[ans,Math.max(0,ans+.1),Math.max(0,ans-.1)].map(x=>fracOrNum(x));vals.sort(()=>Math.random()-.5);$('quickChoices').innerHTML='';vals.forEach(v=>{let d=document.createElement('div');d.className='chip';d.textContent=v;d.onclick=()=>{$('answer').value=v};$('quickChoices').appendChild(d)})}
function load(){answered=false;const p=puzzles[i];$('round').textContent=(i+1)+'/'+puzzles.length;$('score').textContent=score;$('energy').textContent=energy;$('question').textContent=p.q;$('details').textContent=p.context;$('formula').textContent=p.exactlyOne?'Exactly one = path 1 success + path 2 success':'Multiply probabilities along branches. Add branches only when there are multiple winning paths.';$('answer').value='';$('feedback').textContent='You may answer as a decimal or fraction.';$('progress').style.width=(i/puzzles.length*100)+'%';draw(p);choices(p.ans)}
function check(){if(answered)return;let p=puzzles[i],v=parseAns($('answer').value);if(Number.isNaN(v)){ $('feedback').textContent='Enter a decimal or fraction first.';return;}answered=true;if(Math.abs(v-p.ans)<.006){let pts=130+Math.round(energy/10);score+=pts;energy=Math.min(100,energy+3);$('feedback').innerHTML='Correct. '+p.why+' <b>+'+pts+'</b> points.'}else{energy=Math.max(0,energy-12);$('feedback').innerHTML='Not quite. Correct answer: <b>'+fracOrNum(p.ans)+'</b>. '+p.why}$('score').textContent=score;$('energy').textContent=energy;$('next').textContent=i===puzzles.length-1?'Finish':'Next puzzle'}
function next(){if(i>=puzzles.length-1){const rank=score>900?'Probability Navigator':score>650?'Tree Climber':'Branch Beginner';$('question').textContent='Exploration complete';$('details').textContent='Rank: '+rank;$('feedback').innerHTML='Final score: <b>'+score+'</b><br>Key skill: multiply along a path, add separate successful paths.';$('next').textContent='Restart';$('next').onclick=reset;return;}i++;load()}
function reset(){i=0;score=0;energy=100;$('next').onclick=next;load()}$('check').onclick=check;$('next').onclick=next;$('reset').onclick=reset;load();
</script></body></html>
