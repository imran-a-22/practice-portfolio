<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Habitat Balance Designer</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101427;color:#eef3ff;font-family:Verdana,sans-serif;padding:18px}.ship{max-width:1180px;margin:auto;border:4px solid #9fffd5;border-radius:22px;background:#161d36;box-shadow:0 0 55px #9fffd544;overflow:hidden}header{padding:22px;background:linear-gradient(90deg,#17204a,#235c52);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:clamp(30px,5vw,58px)}.sub{max-width:700px;line-height:1.45}.stats{display:flex;gap:10px}.stat{background:#101427;border:2px solid #9fffd5;border-radius:12px;min-width:90px;text-align:center;padding:9px 13px}.stat b{display:block;font-size:28px;color:#f8e16c}main{display:grid;grid-template-columns:1fr 360px;min-height:650px}.planetBay{display:grid;place-items:center;background:radial-gradient(circle at center,#25325f,#060812);position:relative;overflow:hidden}.stars{position:absolute;inset:0;background:radial-gradient(circle,#fff 0 1px,transparent 2px);background-size:38px 38px;opacity:.35}.planet{width:360px;height:360px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9fffd5,#247a74 45%,#10293d 70%);box-shadow:inset -45px -45px 0 #0004,0 0 70px #9fffd588;position:relative;transition:.3s}.planet.hot{background:radial-gradient(circle at 35% 30%,#ffe99b,#ff793f 45%,#5b1609 70%)}.planet.cold{background:radial-gradient(circle at 35% 30%,#e9fbff,#74b9ff 45%,#12315b 70%)}.planet.dry{background:radial-gradient(circle at 35% 30%,#ffe4a3,#c88b3d 45%,#4c2a0c 70%)}.marker{position:absolute;border:3px solid #eef3ff;border-radius:50%;padding:12px;background:#0006}.m1{left:70px;top:90px}.m2{right:80px;top:170px}.m3{left:150px;bottom:70px}.panel{border-left:4px solid #9fffd5;padding:22px;background:#0d1328}.mission{border:2px solid #9fffd5;border-radius:16px;padding:15px;background:#17204a;line-height:1.45}.slider{margin:18px 0}.slider label{display:flex;justify-content:space-between;margin-bottom:6px}input[type=range]{width:100%}.readout{height:22px;background:#263355;border:2px solid #9fffd5;border-radius:99px;overflow:hidden}.fill{height:100%;background:#9fffd5;width:50%}.scorebox{font-size:40px;color:#f8e16c;text-align:center;margin:16px 0}.feedback{min-height:115px;background:#17204a;border-left:8px solid #f8e16c;padding:14px;line-height:1.45}button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:10px;background:#9fffd5;color:#101427;font-weight:bold;cursor:pointer}@media(max-width:900px){main{grid-template-columns:1fr}.panel{border-left:0;border-top:4px solid #9fffd5}.planet{width:280px;height:280px;margin:40px 0}}</style></head><body><div class="ship"><header><div><h1>Habitat Balance Designer</h1><div class="sub">Tune temperature, water, atmosphere, and biodiversity to create a stable habitat for different life forms.</div></div><div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">World<b id="world">1</b></div></div></header><main><section class="planetBay"><div class="stars"></div><div class="planet" id="planet"><div class="marker m1">🌿</div><div class="marker m2">💧</div><div class="marker m3">🫧</div></div></section><aside class="panel"><div class="mission"><h2 id="name">Mission</h2><p id="brief"></p></div><div id="sliders"></div><div class="scorebox" id="habitability">50%</div><button id="test">Test Habitat</button><button id="next">Next World</button><div class="feedback" id="feedback">Adjust the habitat controls.</div></aside></main></div><script>const missions=[{name:"Frog Wetland",brief:"Amphibians need high water, moderate temperature, breathable air, and strong biodiversity.",target:{temp:55,water:85,air:70,bio:80}},{name:"Desert Lizard Zone",brief:"Lizards can tolerate heat and low water, but still need air and a food web.",target:{temp:80,water:25,air:65,bio:55}},{name:"Alpine Forest",brief:"Cold forests need cool temperatures, medium water, clean atmosphere, and biodiversity.",target:{temp:35,water:60,air:80,bio:75}},{name:"Microbe Starter World",brief:"Simple microbes can survive tougher conditions, but need some water and atmosphere.",target:{temp:65,water:45,air:45,bio:25}}];let i=0,score=0,vals={temp:50,water:50,air:50,bio:50};const labels={temp:"Temperature",water:"Water",air:"Atmosphere",bio:"Biodiversity"};function load(){let m=missions[i];name.textContent=m.name;brief.textContent=m.brief;world.textContent=i+1;vals={temp:50,water:50,air:50,bio:50};sliders.innerHTML=Object.keys(vals).map(k=>`<div class="slider"><label><b>${labels[k]}</b><span id="${k}v">50</span></label><input type="range" min="0" max="100" value="50" data-k="${k}"><div class="readout"><div class="fill" id="${k}f"></div></div></div>`).join("");document.querySelectorAll("input[type=range]").forEach(s=>s.oninput=()=>{vals[s.dataset.k]=Number(s.value);update()});feedback.textContent="Tune the world to fit the mission.";update()}function update(){Object.keys(vals).forEach(k=>{document.getElementById(k+"v").textContent=vals[k];document.getElementById(k+"f").style.width=vals[k]+"%"});let t=missions[i].target,total=0;Object.keys(vals).forEach(k=>total+=Math.max(0,100-Math.abs(vals[k]-t[k])));let pct=Math.round(total/4);habitability.textContent=pct+"%";planet.className="planet "+(vals.temp>70?"hot":vals.temp<40?"cold":vals.water<35?"dry":"")}test.onclick=()=>{let pct=Number(habitability.textContent.replace("%",""));if(pct>=85){score+=150;feedback.textContent="Excellent habitat. Your variables fit the organism's needs."}else if(pct>=70){score+=80;feedback.textContent="Survivable, but not ideal. Compare your sliders to the clues."}else{score=Math.max(0,score-20);feedback.textContent="Unstable habitat. The organism may not survive those conditions."}document.getElementById("score").textContent=score};next.onclick=()=>{i=(i+1)%missions.length;load()};load();</script></body></html>
