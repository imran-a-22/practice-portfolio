<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Art Museum Curator</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#ede7da;color:#1f2937;font-family:'Trebuchet MS',Arial,sans-serif;padding:18px;display:flex;justify-content:center;align-items:center}.museum{width:min(1200px,100%);background:#fffaf0;border-radius:8px;box-shadow:0 20px 70px rgba(55,48,35,.25);border:1px solid #d6c7aa;overflow:hidden}header{padding:28px 32px;background:linear-gradient(90deg,#1f2937,#374151);color:#fffaf0;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}h1{margin:0;font-size:clamp(32px,5vw,60px);font-weight:400;letter-spacing:2px}.lead{margin:8px 0 0;color:#e5dcc9;max-width:760px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#fffaf0;color:#1f2937;padding:10px 14px;border-radius:2px;box-shadow:inset 0 -4px 0 #d6c7aa}.stat b{color:#92400e}.gallery{display:grid;grid-template-columns:.85fr 1.15fr;gap:18px;padding:24px;background:linear-gradient(#f8f2e8,#efe5d2)}.cardPanel,.wings{background:#fffdf7;border:1px solid #d6c7aa;box-shadow:0 8px 18px rgba(69,56,34,.08);padding:20px}.artCard{border:10px solid #6b4e2e;background:#fef3c7;box-shadow:0 12px 20px rgba(0,0,0,.13);padding:14px;min-height:330px;display:flex;flex-direction:column;gap:14px;align-items:stretch}.painting{height:155px;background:#ddd;position:relative;overflow:hidden;border:6px solid #f8fafc}.painting.renaissance{background:linear-gradient(145deg,#8b5a2b,#f8d98d)}.painting.renaissance:before{content:"";position:absolute;width:64px;height:64px;border-radius:50%;background:#f6c177;left:46%;top:28%;box-shadow:0 70px 0 35px #1e3a5f}.painting.baroque{background:radial-gradient(circle at 70% 35%,#fde68a 0 12%,#78350f 13% 42%,#111827 43%)}.painting.baroque:after{content:"";position:absolute;inset:20px 40px;border:3px solid #f59e0b;transform:rotate(-10deg)}.painting.impressionism{background:repeating-radial-gradient(circle at 25% 40%,#bfdbfe 0 8px,#bbf7d0 9px 16px,#fde68a 17px 25px)}.painting.cubism{background:linear-gradient(45deg,#ef4444 0 20%,#f59e0b 20% 40%,#1d4ed8 40% 60%,#111827 60% 80%,#f8fafc 80%)}.painting.pop{background:radial-gradient(circle,#facc15 0 12%,transparent 13%),linear-gradient(90deg,#ec4899,#22d3ee);background-size:34px 34px,100%}.label{font-size:13px;color:#6b7280;text-transform:uppercase;letter-spacing:1px}.artTitle{font-size:24px;font-weight:900;color:#3b2f24}.desc{line-height:1.45}.wingGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.wing{min-height:95px;border:2px solid #d6c7aa;background:#f8f2e8;padding:12px;cursor:pointer;transition:.15s}.wing:hover{transform:translateY(-2px);border-color:#92400e}.wing h3{margin:0 0 6px;font-size:17px;color:#5c3b1e}.wing p{margin:0;font-size:13px;line-height:1.35;color:#6b5b48}.wing.correct{background:#dcfce7;border-color:#16a34a}.wing.wrong{background:#fee2e2;border-color:#dc2626}.feedback{margin-top:16px;min-height:84px;border-left:6px solid #92400e;background:#fff7ed;padding:14px;line-height:1.45}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{background:#1f2937;color:#fffaf0;border:0;padding:12px 16px;cursor:pointer;font-weight:800;border-radius:2px}.gold{background:#92400e}.progress{height:12px;background:#e8dcc7;margin-top:16px;overflow:hidden}.progress div{height:100%;width:0;background:linear-gradient(90deg,#92400e,#f59e0b);transition:.3s}@media(max-width:860px){header,.gallery{grid-template-columns:1fr}.wingGrid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="museum"><header><div><h1>Art Museum Curator</h1><p class="lead">Sort mysterious artworks into the correct museum wing. Learn major art movements through visual clues and style descriptions.</p></div><div class="stats"><span class="stat">Reputation <b id="rep">50</b></span><span class="stat">Score <b id="score">0</b></span><span class="stat">Artwork <b id="round">1</b>/10</span></div></header><section class="gallery"><div class="cardPanel"><div class="artCard"><div id="painting" class="painting"></div><span class="label">Incoming artwork</span><div class="artTitle" id="artTitle">Title</div><div class="desc" id="desc">Description</div></div><div class="progress"><div id="bar"></div></div><div class="buttons"><button class="gold" id="nextBtn">Start curation</button><button id="resetBtn">Reset</button></div></div><div class="wings"><h2>Choose the correct wing</h2><div class="wingGrid" id="wingGrid"></div><div class="feedback" id="feedback">Read the clues, then select a wing.</div></div></section></div>
<script>
const wings={Renaissance:'Realistic human figures, perspective, balance and classical ideas.',Baroque:'Drama, contrast, movement, emotion and strong light/dark effects.',Impressionism:'Loose brush marks, outdoor light, colour and ordinary modern scenes.',Cubism:'Objects broken into geometric shapes and multiple viewpoints.',PopArt:'Bold popular culture, bright colours, comics, advertising and repetition.'};
const artworks=[
 {title:'The Balanced Scholar',style:'Renaissance',desc:'A calm portrait uses mathematical perspective, realistic anatomy and a classical arch behind the figure.',paint:'renaissance'},
 {title:'Storm over the Chapel',style:'Baroque',desc:'Figures twist through shadow while a bright beam of light creates a dramatic spiritual moment.',paint:'baroque'},
 {title:'Morning at the Station',style:'Impressionism',desc:'Short colourful marks capture steam, sunlight and a busy modern platform rather than sharp detail.',paint:'impressionism'},
 {title:'Violin from Five Angles',style:'Cubism',desc:'A musical instrument is split into angular fragments, showing several viewpoints at once.',paint:'cubism'},
 {title:'Soup Can Celebration',style:'PopArt',desc:'A commercial object is repeated in loud colours, turning mass culture into gallery art.',paint:'pop'},
 {title:'Saint in the Spotlight',style:'Baroque',desc:'The image uses theatrical lighting, movement and emotional intensity to pull the viewer in.',paint:'baroque'},
 {title:'Garden Light Study',style:'Impressionism',desc:'The subject is less important than the effect of shifting light and colour outdoors.',paint:'impressionism'},
 {title:'City Face Collage',style:'Cubism',desc:'A face and skyline are rearranged into flat planes, edges and geometric blocks.',paint:'cubism'},
 {title:'Hero with Geometry',style:'Renaissance',desc:'The work shows proportion, symmetry and a believable space created with perspective.',paint:'renaissance'},
 {title:'Comic Sound Burst',style:'PopArt',desc:'Ben-Day style dots, advertising energy and comic-book drama dominate the composition.',paint:'pop'}
];
let i=-1,score=0,rep=50,locked=false;const $=id=>document.getElementById(id);const wingGrid=$('wingGrid');
function drawWings(){wingGrid.innerHTML='';Object.entries(wings).forEach(([name,info])=>{const d=document.createElement('div');d.className='wing';d.innerHTML='<h3>'+name+'</h3><p>'+info+'</p>';d.onclick=()=>choose(name,d);wingGrid.appendChild(d);});}
function load(){locked=false;i++;if(i>=artworks.length){finish();return;}const a=artworks[i];$('painting').className='painting '+a.paint;$('artTitle').textContent=a.title;$('desc').textContent=a.desc;$('round').textContent=i+1;$('score').textContent=score;$('rep').textContent=rep;$('bar').style.width=(i/artworks.length*100)+'%';$('feedback').textContent='Which wing matches these visual and historical clues?';drawWings();$('nextBtn').textContent='Skip artwork';}
function choose(name,el){if(locked)return;locked=true;const a=artworks[i];document.querySelectorAll('.wing').forEach(w=>{if(w.querySelector('h3').textContent===a.style)w.classList.add('correct')});if(name===a.style){const pts=100+Math.floor(rep/5);score+=pts;rep=Math.min(100,rep+8);el.classList.add('correct');$('feedback').innerHTML='Correct. <b>'+a.style+'</b> fits because: '+wings[a.style]+' +'+pts+' points.';}else{rep=Math.max(0,rep-12);el.classList.add('wrong');$('feedback').innerHTML='Wrong wing. This belongs to <b>'+a.style+'</b>. Clue: '+wings[a.style];}$('score').textContent=score;$('rep').textContent=rep;$('nextBtn').textContent=i===artworks.length-1?'Finish exhibition':'Next artwork';}
function finish(){locked=true;$('artTitle').textContent='Exhibition opened';$('desc').textContent='The museum board reviewed your final curation performance.';$('painting').className='painting pop';$('bar').style.width='100%';wingGrid.innerHTML='';const rank=score>900?'Chief Curator':score>650?'Gallery Specialist':'Junior Curator';$('feedback').innerHTML='Final score: <b>'+score+'</b><br>Reputation: <b>'+rep+'</b><br>Rank: <b>'+rank+'</b>';$('nextBtn').textContent='Restart';$('nextBtn').onclick=reset;}
function reset(){i=-1;score=0;rep=50;$('nextBtn').onclick=load;load();}
$('nextBtn').onclick=load;$('resetBtn').onclick=reset;drawWings();
</script></body></html>
