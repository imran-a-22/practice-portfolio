<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Color Theory Mixer</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:conic-gradient(from 90deg,#ff4d6d,#ffd166,#06d6a0,#118ab2,#8338ec,#ff4d6d);padding:18px;color:#201428}.studio{max-width:1120px;margin:auto;background:#fffaf2;border:7px solid #201428;border-radius:28px;overflow:hidden;box-shadow:16px 16px 0 rgba(0,0,0,.35)}header{padding:22px;background:#201428;color:white;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{margin:0;font-size:clamp(30px,5vw,60px)}.stats{display:flex;gap:9px}.stat{background:white;color:#201428;border-radius:12px;padding:9px 14px;text-align:center;min-width:85px}.stat b{display:block;font-size:27px}main{display:grid;grid-template-columns:1fr 340px;min-height:640px}.canvas{display:grid;place-items:center;background:repeating-linear-gradient(45deg,#f7eadf 0 20px,#fffaf2 20px 40px);border-right:7px solid #201428;padding:28px}.wheel{width:min(520px,80vw);aspect-ratio:1;border-radius:50%;background:conic-gradient(red,orange,yellow,lime,cyan,blue,violet,red);border:10px solid #201428;position:relative;box-shadow:0 20px 35px rgba(0,0,0,.28)}.mix{position:absolute;inset:26%;border-radius:50%;background:rgb(128,128,128);border:8px solid #201428;display:grid;place-items:center;text-align:center;font-weight:bold;font-size:24px;color:white;text-shadow:1px 1px #000}.swatches{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:24px}.swatch{width:90px;height:70px;border:4px solid #201428;border-radius:14px;cursor:pointer}.panel{padding:22px;background:#fffaf2}.card{background:white;border:4px solid #201428;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:5px 5px 0 #201428;line-height:1.45}.sliders label{display:block;margin:10px 0 5px}input[type=range]{width:100%}.choices{display:grid;gap:10px}.choices button,button{border:0;border-radius:14px;background:#201428;color:white;padding:13px;font-weight:bold;cursor:pointer;text-align:left}.feedback{min-height:120px;background:#f7eadf;border-left:8px solid #8338ec;border-radius:12px;padding:12px;line-height:1.45}@media(max-width:850px){main{grid-template-columns:1fr}.canvas{border-right:0;border-bottom:7px solid #201428}}</style></head><body><div class="studio"><header><div><h1>Color Theory Mixer</h1><p>Mix RGB colors and answer color harmony challenges.</p></div><div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">Task<b id="taskNo">1</b></div></div></header><main><section class="canvas"><div><div class="wheel"><div class="mix" id="mix">rgb</div></div><div class="swatches" id="swatches"></div></div></section><aside class="panel"><div class="card"><h2 id="prompt">Challenge</h2><p id="challenge"></p></div><div class="card sliders"><label>Red <span id="rTxt">128</span></label><input id="r" type="range" min="0" max="255" value="128"><label>Green <span id="gTxt">128</span></label><input id="g" type="range" min="0" max="255" value="128"><label>Blue <span id="bTxt">128</span></label><input id="b" type="range" min="0" max="255" value="128"></div><div class="choices" id="choices"></div><button id="next" style="width:100%;margin-top:10px">Next Challenge</button><div class="feedback" id="feedback">Adjust sliders or answer the harmony question.</div></aside></main></div><script>const tasks=[{q:'Create a strong purple using red and blue.',type:'mix',target:[150,0,180],why:'Purple is made by combining red and blue with little green.'},{q:'Which harmony uses opposite colors on the wheel?',type:'quiz',answer:'Complementary',opts:['Analogous','Complementary','Monochrome'],why:'Complementary colors sit opposite each other and create strong contrast.'},{q:'Create a warm orange.',type:'mix',target:[255,120,0],why:'Orange needs high red, some green, and very low blue.'},{q:'Which scheme uses neighboring colors?',type:'quiz',answer:'Analogous',opts:['Triadic','Analogous','Complementary'],why:'Analogous colors sit next to each other on the color wheel.'}];let i=0,score=0;const r=document.getElementById('r'),g=document.getElementById('g'),b=document.getElementById('b');function update(){rTxt.textContent=r.value;gTxt.textContent=g.value;bTxt.textContent=b.value;mix.style.background=`rgb(${r.value},${g.value},${b.value})`;mix.textContent=`${r.value}, ${g.value}, ${b.value}`}r.oninput=g.oninput=b.oninput=update;function load(){taskNo.textContent=i+1;challenge.textContent=tasks[i].q;choices.innerHTML='';if(tasks[i].type==='quiz'){choices.innerHTML=tasks[i].opts.map(x=>'<button>'+x+'</button>').join('');document.querySelectorAll('#choices button').forEach(btn=>btn.onclick=()=>checkQuiz(btn.textContent))}else{choices.innerHTML='<button onclick="checkMix()">Check Mix</button>'}feedback.textContent='Complete the challenge.';update()}function checkMix(){let t=tasks[i].target,dist=Math.abs(r.value-t[0])+Math.abs(g.value-t[1])+Math.abs(b.value-t[2]);if(dist<150){score+=120;feedback.textContent='Good mix. '+tasks[i].why}else{score=Math.max(0,score-15);feedback.textContent='Not close enough. '+tasks[i].why}document.getElementById('score').textContent=score}function checkQuiz(x){if(x===tasks[i].answer){score+=110;feedback.textContent='Correct. '+tasks[i].why}else{score=Math.max(0,score-15);feedback.textContent='Not quite. Answer: '+tasks[i].answer+'. '+tasks[i].why}document.getElementById('score').textContent=score}next.onclick=()=>{i=(i+1)%tasks.length;load()};load();</script></body></html>
